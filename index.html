<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1f1e1c">
<title>Lanterne</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#1f1e1c; --bg2:#262624; --bg3:#30302e; --line:#3d3c39;
  --tx:#e8e6dc; --tx2:#b5b3aa; --tx3:#85837b;
  --acc:#d97757; --acc2:#e8957a; --onacc:#1b1410; --err:#e07a6a;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --fs:17px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:6px;height:6px;background:transparent}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--tx3,#888) 35%,transparent);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--acc,#d97757) 60%,transparent)}
::-webkit-scrollbar-button{display:none;width:0;height:0}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--tx3,#888) 35%,transparent) transparent}}
#inp{scrollbar-width:none}#inp::-webkit-scrollbar{display:none}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:90px;line-height:1.45}
.hidden{display:none!important}
.app{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:6px;padding:10px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg)}
header h1{flex:1;font-size:16px;font-weight:600;margin:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
header h1 span{overflow:hidden;text-overflow:ellipsis}
.logo{width:30px;height:30px;border-radius:8px;flex:none}
.ver{font:500 11px var(--sans);color:var(--tx3);opacity:.55;background:none;border:0;padding:4px 6px;margin-left:2px;border-radius:8px;position:relative;align-self:center;transition:opacity .15s}
.ver:hover{opacity:1}
.ver.new::after{content:"";position:absolute;top:2px;right:0;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.clv{margin-bottom:14px}
.clh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cl{margin:0;padding-left:20px;color:var(--tx2);line-height:1.55;font-size:14.5px}
.cl li{margin-bottom:4px}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--tx2);flex:none}
.ib:active{background:var(--bg3)}
.ib svg{width:22px;height:22px}
main{flex:1;overflow-y:auto;overscroll-behavior:contain}
.pad{padding:16px}
.btn{background:var(--acc);color:var(--onacc);font-weight:600;border-radius:12px;padding:12px 16px}
.btn:active{filter:brightness(.92)}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--bg3);color:var(--tx)}
.btn.danger{background:transparent;color:var(--err);border:1px solid color-mix(in srgb,var(--err) 40%,transparent)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.row{display:flex;gap:8px;align-items:center}
.empty{color:var(--tx3);text-align:center;padding:40px 10px;line-height:1.6}
.stat{display:flex;justify-content:space-between;align-items:center;color:var(--tx3);font-size:13px;margin:0 2px 14px}
.stat b{color:var(--tx2);font-weight:600;font-variant-numeric:tabular-nums}
/* Home */
.hero{padding:6px 2px 18px}
.hero .greet{font-family:var(--serif);font-size:28px;line-height:1.2}
.hero .sub{color:var(--tx3);margin-top:4px}
.stats{display:flex;gap:10px;margin:16px 0 4px}
.stats div{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats span{color:var(--tx3);font-size:12px}
.secT{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin:22px 2px 10px}
.cover{background-size:cover;background-position:center;position:relative;overflow:hidden}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center}
.cover.nocov{background:radial-gradient(circle at 50% 45%,#2c2b29,#1c1b19 75%)}
.cover .ph svg{height:46%;max-height:90px;width:auto}
.item .cover .ph svg{height:58%}
.feat{border-radius:16px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);display:block;width:100%;text-align:left;padding:0}
.feat .cover{height:150px}
.feat .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}
.feat .in{padding:12px 14px 14px}
.feat .t{font-weight:600;font-size:17px}
.feat .s{color:var(--tx3);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--serif)}
.feat .go{color:var(--acc);font-weight:600;font-size:14px;margin-top:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;width:100%;text-align:left}
.item .cover{width:58px;height:58px;border-radius:10px;flex:none}
.item .cover .ph{font-size:24px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{color:var(--tx3);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat,.item{cursor:pointer;position:relative}
.acts{display:flex;align-items:center;gap:6px;flex:none}
.play{width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;flex:none;border:0;transition:transform .15s,filter .15s}
.play:hover{transform:scale(1.07);filter:brightness(1.08)}
.play svg{width:16px;height:16px;margin-left:0}
.mini{display:flex;align-items:center;gap:2px}
.more{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--tx3);background:transparent;border:0;opacity:.55;transition:opacity .15s,color .15s,background .15s}
.more svg{width:18px;height:18px}
.more:hover{opacity:1;color:var(--tx);background:var(--bg3)}
.trash{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--tx3);background:transparent;border:0;opacity:.55;transition:opacity .15s,color .15s,background .15s}
.trash svg{width:17px;height:17px}
.trash:hover{opacity:1;color:var(--err);background:color-mix(in srgb,var(--err) 12%,transparent)}
.feat .row2{display:flex;align-items:center;gap:12px}
.feat .row2 .grow{flex:1;min-width:0}
.feat .play{width:42px;height:42px}
.feat .play svg{width:15px;height:15px}
.gal{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.galbox{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:760px;height:88dvh;display:flex;flex-direction:column;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.galhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.galhd b{font-size:17px}
.galup{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:1px dashed var(--line);border-radius:12px;color:var(--tx2);background:transparent;margin-bottom:12px}
.galup:hover{border-color:var(--acc);color:var(--acc)}
.galchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;flex:none}
.galchips::-webkit-scrollbar{display:none}
.galgrid{flex:1;scrollbar-gutter:stable;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:max-content;align-content:start;gap:8px;overflow-y:auto;min-height:0;padding-bottom:4px}
.galit{height:0;padding:0 0 56.25% !important;width:100%;border-radius:12px;background-size:cover;background-position:center;border:1px solid var(--line);position:relative;overflow:hidden;padding:0}
.galit span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:12px;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.galit:hover{outline:2px solid var(--acc);outline-offset:1px}
@media (min-width:700px){.galbox{border-radius:20px;margin-bottom:5vh;height:min(88dvh,820px)}.galgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:899px){
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid .item{flex-direction:column;align-items:stretch;padding:0;gap:0;overflow:hidden;margin:0}
  .grid .item .cover{width:100%;height:92px;border-radius:0}
  .grid .item .grow{padding:9px 10px 10px;padding-right:46px}
  .grid .item .t{font-size:14px}
  .grid .item .m{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grid .item .play{position:absolute;right:8px;bottom:10px;width:32px;height:32px}
  .grid .item .play svg{width:12px;height:12px}
  .grid .item .mini{position:absolute;right:6px;top:6px;gap:0;background:rgba(0,0,0,.42);border-radius:999px;padding:1px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .grid .item .mini button{width:28px;height:28px;color:#fff;opacity:.9}
  .grid .item .mini svg{width:14px;height:14px}
}
@media (hover:hover){.mini{opacity:0;transition:opacity .15s}.feat:hover .mini,.item:hover .mini,.mini:focus-within{opacity:1}}
.app.wide{max-width:1180px}
@media (min-width:900px){
  .app.wide .pad{padding:28px 40px 40px}
  .app.wide .hero{display:grid;grid-template-columns:1fr auto;column-gap:32px;align-items:end;padding-bottom:6px}
  .app.wide .hero .greet{grid-column:1;grid-row:1;font-size:34px;align-self:end}
  .app.wide .hero .sub{grid-column:1;grid-row:2;align-self:start;margin-top:6px}
  .app.wide .hero .stats{grid-column:2;grid-row:1;margin:0;gap:28px;justify-content:flex-end}
  .app.wide .hero .stats div{background:none;border:0;padding:0;text-align:right;flex:none}
  .app.wide .hero .stats b{font-size:20px}
  .app.wide .hero > .wide{grid-column:2;grid-row:2;width:auto;margin-top:12px !important;padding:11px 22px}
  .app.wide .hero .syncline{grid-column:1 / -1;justify-self:start;margin-top:10px}
  .app.wide .feat{height:320px;border-radius:20px}
  .app.wide .feat .cover{position:absolute;inset:0;height:auto}
  .app.wide .feat .cover::after{background:linear-gradient(90deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.45) 45%,rgba(0,0,0,.05) 100%),linear-gradient(0deg,rgba(0,0,0,.5),transparent 55%)}
  .app.wide .feat .cover .ph{justify-items:end;padding-right:9%;color:rgba(255,255,255,.2)}
  .app.wide .feat .cover .ph svg{height:42%;max-height:none}
  .app.wide .feat .in{position:absolute;left:0;right:0;bottom:0;padding:32px 36px;z-index:1}
  .app.wide .feat .row2{align-items:flex-end;gap:24px;justify-content:space-between}
  .app.wide .feat .grow{max-width:620px}
  .app.wide .feat .t{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.15;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4)}
  .app.wide .feat .s{-webkit-line-clamp:3;font-size:15px;line-height:1.5;color:rgba(255,255,255,.78);margin-top:10px}
  .app.wide .feat .play{width:46px;height:46px}
  .app.wide .feat .play svg{width:16px;height:16px}
  .app.wide .grid .item .play{width:36px;height:36px}
  .app.wide .grid .item .play svg{width:13px;height:13px}
  .app.wide .feat .mini{background:rgba(0,0,0,.35);border-radius:999px;padding:2px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .app.wide .feat .mini button{color:#fff;opacity:.85}
  .app.wide .secT{margin-top:30px}
  .app.wide .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .app.wide .grid .item{margin-bottom:0;padding:12px;transition:border-color .15s,background .15s}
  .app.wide .grid .item .mini{position:absolute;right:58px;top:50%;transform:translateY(-50%);background:var(--bg2);box-shadow:-16px 0 14px var(--bg2);border-radius:999px}
  .app.wide .grid .item:hover .mini{background:color-mix(in srgb,var(--acc) 4%,var(--bg2));box-shadow:-16px 0 14px color-mix(in srgb,var(--acc) 4%,var(--bg2))}
  .app.wide .grid .item:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line));background:color-mix(in srgb,var(--acc) 4%,var(--bg2))}
}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.sbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.sbar::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px;color:var(--tx2);white-space:nowrap;flex:none}
.pill b{color:var(--tx);font-weight:600}
.pill svg{width:14px;height:14px}
.pill .sep{width:1px;height:12px;background:var(--line)}
.pill .hpb{width:30px;height:5px;border-radius:9px;background:var(--bg3);overflow:hidden}
.pill .hpb i{display:block;height:100%;background:#7fc79a;border-radius:9px;transition:width .3s}
.pill.low .hpb i{background:var(--err)}
.pill.sug{color:var(--acc2);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.pill.busy{color:var(--tx3)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.roll{display:inline-block;margin-left:10px;font:500 11.5px var(--sans);font-style:normal;padding:2px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--tx2);vertical-align:2px;white-space:nowrap}
.roll.crit{color:#7fc79a;border-color:color-mix(in srgb,#7fc79a 45%,var(--line))}
.roll.fail{color:var(--tx3)}
.roll.fumble{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,var(--line))}
.rpgd{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px;font-family:var(--sans)}
.rpgd span{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.rpgd .neg{color:var(--err)}
.rpgd .pos{color:#7fc79a}
.rpgd.mind{margin-top:-6px}
.rpgd.mind span{color:var(--tx3)}
.rpgd.mind .pos{color:#c9a7ff}
.rpgd.mind .neg{color:var(--err)}
.pill.chars{color:var(--tx2)}
.pill.chars span.noi18n{max-width:160px;overflow:hidden;text-overflow:ellipsis}
.mmood{font-family:var(--serif);font-style:italic;color:var(--tx2);font-size:16px;margin:-4px 0 12px}
.rels{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:16px}
.relr{display:grid;grid-template-columns:78px 1fr 30px;align-items:center;gap:10px;padding:5px 0;font-size:13px;color:var(--tx2)}
.relr b{text-align:right;font-variant-numeric:tabular-nums;color:var(--tx)}
.relb{position:relative;height:6px;border-radius:9px;background:var(--bg3)}
.relb.c::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.relb i{position:absolute;top:0;bottom:0;border-radius:9px}
.relb i.trust{background:#7fc79a}.relb i.affection{background:#e8957a}.relb i.fear{background:#9fb3cc}.relb i.tension{background:var(--err)}
.mrel{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--tx3);margin:6px 0 2px}
.mrel b{color:var(--tx2);font-weight:600}
.subopts{margin:-4px 0 10px 14px;padding-left:12px;border-left:2px solid var(--line)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:4px 4px 4px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--tx2)}
.tag button{width:20px;height:20px;border-radius:50%;color:var(--tx3);background:transparent;border:0;font-size:15px;line-height:1}
.tag button:hover{color:var(--err)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sug{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sug .row:first-child{gap:6px;margin-bottom:8px}
.sug .t{font-weight:600;margin-bottom:4px}
.sug .why{font-size:13px;color:var(--tx3);margin-bottom:8px}
.sug details{margin-bottom:10px;font-size:13px;color:var(--tx3)}
.sug details .old{white-space:pre-wrap;margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--bg3)}
.sug textarea,.sug input{background:var(--bg)}
.rcbox{height:auto !important;max-height:none}
.rctext{color:var(--tx2);line-height:1.5;margin:0 0 14px;font-size:15px}
.rccode{font:600 20px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-align:center;padding:16px 10px;border-radius:14px;background:var(--bg2);border:1px dashed var(--acc);color:var(--tx);margin-bottom:16px;word-break:break-all;user-select:all}
.card .t{font-weight:600}
.card .s{color:var(--tx3);font-size:13px;margin-top:3px}
/* Story */
.banner{height:170px;margin-bottom:-40px}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,var(--bg))}
.story{padding:18px 18px 30px;font-family:var(--serif);font-size:var(--fs);line-height:1.62;position:relative}
.act{white-space:pre-wrap;word-wrap:break-word;padding:2px 0;border-radius:6px}
.act.player{color:var(--acc2);font-style:italic;margin:12px 0}
.act.sel{background:var(--bg3)}
.fi{animation:fi .6s ease-out both}
@keyframes fi{from{opacity:0;filter:blur(1.5px)}to{opacity:1;filter:none}}
.wait{display:inline-flex;gap:5px;padding:6px 0;vertical-align:middle}
.wait i{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:wt 1.4s ease-in-out infinite}
.wait i:nth-child(2){animation-delay:.2s}.wait i:nth-child(3){animation-delay:.4s}
@keyframes wt{0%,100%{opacity:.25}50%{opacity:.8}}
.wstat{font-family:var(--sans);font-size:13px;color:var(--tx3);margin-left:10px;vertical-align:middle}
.err{color:var(--err);font-family:var(--sans);font-size:14px;padding:8px 0}
.meta{color:var(--tx3);font-size:12px;font-family:var(--sans);text-align:center;padding:6px 0 0;font-variant-numeric:tabular-nums}
/* Input bar */
.bar{border-top:1px solid var(--line);background:var(--bg);padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.modes{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}
.mode{padding:6px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--tx2);font-size:13px;white-space:nowrap}
.mode.on{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{min-height:44px;max-height:30vh;resize:none;border-radius:22px;padding:11px 16px}
.send{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
.send.stop{background:var(--bg3);color:var(--tx)}
.tools{display:flex;justify-content:space-around;margin-top:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tx2);font-size:11px;padding:4px 8px;border-radius:8px}
.tool svg{width:20px;height:20px}
.tool:active{background:var(--bg3)}
.tool:disabled{opacity:.35}
/* Sheet — fixed height so tabs never move */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;height:90dvh;background:var(--bg);border-top-left-radius:20px;border-top-right-radius:20px;z-index:21;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:0}
.sheet .sh{display:flex;align-items:center;padding:10px 10px 0 16px;flex:none}
.sheet .sh h2{flex:1;font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);flex:none}
.tab{padding:8px 12px;border-radius:10px;color:var(--tx2);white-space:nowrap;font-size:14px}
.tab.on{background:var(--bg3);color:var(--tx)}
.sheet .body{flex:1;overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
label.f{display:block;margin:0 0 16px}
label.f > span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px;font-weight:600}
.hint{color:var(--tx3);font-size:13px;line-height:1.45;margin:-2px 0 8px}
.hint em{color:var(--tx2);font-style:italic}
.hint a{color:var(--acc2)}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sl{margin-bottom:18px}
.sl .top{display:flex;justify-content:space-between;align-items:baseline}
.sl .top b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.sl .top output{color:var(--tx);font-variant-numeric:tabular-nums}
input[type=range]{padding:0;border:0;background:transparent;height:30px;accent-color:var(--acc)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sw .l{flex:1}
.sw .l b{display:block;font-weight:500}
.sw .l small{color:var(--tx3);font-size:13px;line-height:1.4;display:block;margin-top:2px}
.tg{width:48px;height:28px;border-radius:999px;background:var(--bg3);position:relative;flex:none;border:1px solid var(--line)}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--tx3);transition:.15s}
.tg.on{background:var(--acc);border-color:var(--acc)}
.tg.on::after{left:23px;background:var(--onacc)}
.sc{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.sc .t{font-weight:600}
.sc .k{color:var(--acc2);font-size:12px;margin-top:2px}
.sc .e{color:var(--tx3);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
pre.ctx{white-space:pre-wrap;font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--tx2);overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--bg3);color:var(--tx2)}
.chip.acc{color:var(--acc2)}
details.fold{background:var(--bg2);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
details.fold summary{padding:12px 14px;cursor:pointer;color:var(--tx2);font-size:14px;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"▸ ";color:var(--tx3)}
details.fold[open] summary::before{content:"▾ "}
details.fold .in{padding:0 14px 4px}
.genbox{background:color-mix(in srgb,var(--acc) 7%,var(--bg2));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:14px;padding:14px;margin-bottom:16px}
.genbox .gt{font-weight:600;margin-bottom:4px}
.pickcover{height:120px;border-radius:14px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--tx3);margin-bottom:16px;width:100%;font-size:14px}
.pickcover.has{border:0}
.gauge{height:8px;border-radius:99px;background:var(--bg3);overflow:hidden;margin:8px 0 6px}
.gauge i{display:block;height:100%;background:var(--acc);border-radius:99px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;background:var(--bg2)}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.swatch{display:flex;gap:4px;margin-top:8px}
.swatch i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(128,128,128,.3)}
/* Models */
.mdl{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.mdl.on{border-color:var(--acc)}
.badge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;background:var(--bg3);overflow:hidden}
.badge img{width:26px;height:26px;border-radius:4px}
.mdl .grow{flex:1;min-width:0}
.mdl .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mdl .d{color:var(--tx3);font-size:13px;margin-top:2px;line-height:1.35}
.mdl .p{color:var(--tx2);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.mdl .tg2{color:var(--acc2);font-size:12px;margin-top:2px}
.mdl .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc2);margin-left:6px;vertical-align:1px}
.mdl .chk{color:var(--acc);font-size:18px;flex:none}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90vw}
.menu{position:fixed;z-index:30;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:170px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.menu button{display:block;width:100%;text-align:left;padding:12px 16px}
.menu button:active{background:var(--bg3)}
.alts{display:flex;align-items:center;gap:4px;font-family:var(--sans);font-size:12px;color:var(--tx3);margin:2px 0 6px}
.alts button{width:30px;height:26px;border-radius:8px;color:var(--tx2);font-size:15px}
.alts button:active{background:var(--bg3)}
.alts button:disabled{opacity:.3}
.ideas{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.idea{text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;color:var(--tx)}
.idea:active{background:var(--bg3)}
.ideas .ih{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--tx3)}
.act.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{background:color-mix(in srgb,var(--acc) 25%,transparent)}100%{background:transparent}}
mark{background:color-mix(in srgb,var(--acc) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.res{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left;font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--tx2)}
.res .rk{font-family:var(--sans);font-size:11px;color:var(--tx3);margin-bottom:2px}
.ob{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.ob .box{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:760px;padding:22px 20px calc(18px + env(safe-area-inset-bottom))}
.ob .em{font-size:34px}
.ob h3{margin:8px 0 6px;font-size:20px;font-family:var(--serif);font-weight:500}
.ob p{color:var(--tx2);line-height:1.5;margin:0 0 16px;font-size:15px}
.ob .dots{display:flex;gap:6px}
.ob .dots i{width:7px;height:7px;border-radius:50%;background:var(--bg3)}
.ob .dots i.on{background:var(--acc)}
.bars{margin:6px 0 16px}
.bars .br{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--tx3);margin-bottom:6px}
.bars .bt{height:10px;background:var(--bg3);border-radius:99px;overflow:hidden}
.bars .bt i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bars .bv{color:var(--tx2);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.kpis div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpis b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kpis span{font-size:12px;color:var(--tx3)}
.tool{padding:4px 4px}
.syncline{display:block;margin-top:10px;font-size:12px;color:var(--tx3);padding:2px}
.syncline b{color:var(--tx2);font-weight:500}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="ib hidden" id="backBtn" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="title"></h1>
    <button class="ib hidden" id="searchBtn" aria-label="Rechercher"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="ib hidden" id="advBtn" aria-label="Aventure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 012-2h13v16H6a2 2 0 00-2 2.5zM4 19.5A2.5 2.5 0 016.5 22H19"/><path d="M9 7h6M9 11h6"/></svg></button>
    <button class="ib" id="setBtn" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </header>

  <main id="libView"><div class="pad" id="lib"></div></main>

  <main id="storyView" class="hidden"><div id="bannerHost"></div><div class="story" id="story"></div></main>
  <div class="bar hidden" id="bar">
    <div class="ideas hidden" id="ideas"></div>
    <div class="sbar hidden" id="sbar"></div>
    <div class="modes" id="modes">
      <button class="mode on" data-m="do">Faire</button>

      <button class="tool" id="contBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Continuer</button>
      <button class="tool" id="retryBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12a9 9 0 109-9 9.5 9.5 0 00-6.7 2.8L3 8"/><path d="M3 3v5h5"/></svg>Réessayer</button>
      <button class="tool" id="undoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>Annuler</button>
      <button class="tool" id="redoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg>Rétablir</button>
      <button class="tool" id="ideaBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>Idées</button>
      <button class="tool" id="ttsBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg><span>Écouter</span></button>
    </div>
  </div>
</div>

<div id="sheetHost"></div>

<script>
"use strict";
/* ================= Storage ================= */
const SYNC_RE = /^lan\.(adv|cover)\.|^lan\.(settings|stats)$/;
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); if(SYNC_RE.test(k)) syncTouch(k); return true; }catch(e){ toast("Sauvegarde impossible : " + e.message); return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} if(SYNC_RE.test(k)) syncTouch(k); }
};
function syncTouch(k){
  try{
    const m = JSON.parse(localStorage.getItem("lan.mtime") || "{}"); m[k] = Date.now(); localStorage.setItem("lan.mtime", JSON.stringify(m));
    const d = JSON.parse(localStorage.getItem("lan.dirty") || "{}"); d[k] = 1; localStorage.setItem("lan.dirty", JSON.stringify(d));
  }catch(e){}
  clearTimeout(syncTouch.t); syncTouch.t = setTimeout(() => syncNow(false), 1500);
}
const LOGO = `<svg class="logo" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#30302e"/><g transform="translate(256 262)"><path d="M-40-150h80M0-150v28" stroke="#85837b" stroke-width="18" stroke-linecap="round"/><path d="M-78-118h156l-14 196h-128z" fill="#262624" stroke="#b5b3aa" stroke-width="14" stroke-linejoin="round"/><ellipse cx="0" cy="-10" rx="36" ry="58" fill="#d97757"/><ellipse cx="0" cy="4" rx="16" ry="30" fill="#f2c4a8"/><path d="M-96 92h192" stroke="#b5b3aa" stroke-width="16" stroke-linecap="round"/></g></svg>`;
const DEFAULT_INSTRUCTIONS =
`You are the narrator of an interactive text adventure. The player controls the protagonist, addressed as "you".
Lines starting with ">" are the player's actions; a quoted line after ">" is something the player says. Other player lines are narration the player wrote and should be treated as canon.
- Continue the story from where it left off, reacting to the player's last action with vivid, grounded prose.
- Never act, speak or decide for the player character beyond what their action states. Stop at a natural point where the player can act.
- Keep characters consistent with their established personalities, goals and knowledge. NPCs have their own agency.
- Show, don't tell. Vary sentence rhythm. Avoid clichés, purple prose and repeating phrases from earlier in the story.
- Write 1 to 3 paragraphs. No meta commentary, no headings, no options lists.
- Write in the same language as the story.`;
const SCRIPT_GLUE = `The user message contains the full story context. Continue the story text from exactly where it ends, without repeating it. If the context contains <SYSTEM> instructions, follow them exactly, including any required output format.`;
const AN_HINT = `Une consigne courte, glissée juste avant ta dernière action. C'est le réglage le plus influent sur le ton et le rythme. Exemples : <em>« Ton sombre et mélancolique. Rythme lent, beaucoup de dialogues. »</em> ou <em>« Ambiance légère et pleine d'humour. Les personnages parlent de façon familière. »</em>`;
const KEYS_HINT = "Quand un de ces mots apparaît dans l'histoire, la carte est envoyée à l'IA pour qu'elle s'en souvienne. Sépare-les par des virgules.";
const TYPES = ["personnage","lieu","objet","faction","concept","autre"];
const SCRIPT_DEF = () => ({ ac: false, is: false, names: "", player: "", sc: false, scAuto: false, scEvery: 3, ar: false, arRetry: true, rpg: false, rpgDice: true, minds: false, mindEvery: 2, mindChips: true });

const THEMES = {
  braise:    { name: "Braise",    v: { bg:"#1f1e1c", bg2:"#262624", bg3:"#30302e", line:"#3d3c39", tx:"#e8e6dc", tx2:"#b5b3aa", tx3:"#85837b", acc:"#d97757", acc2:"#e8957a", onacc:"#1b1410" } },
  nuit:      { name: "Nuit",      v: { bg:"#14161d", bg2:"#1b1e27", bg3:"#252935", line:"#30354a", tx:"#dfe3ee", tx2:"#a9b0c4", tx3:"#767d93", acc:"#7aa2f7", acc2:"#9db8fa", onacc:"#0e1220" } },

};
const DEFAULT_STYLE = { theme: "braise", font: "classique", size: 17 };

const DEFAULT_SETTINGS = {
  provider: "openrouter", baseUrl: "", apiKey: "", model: "deepseek/deepseek-v4-pro-0813",

  currency: "EUR"
};
let settings = Object.assign({}, DEFAULT_SETTINGS, LS.get("lan.settings", {}));

/* ================= Langue (FR / EN) ================= */
const isEN = () => settings.lang === "en";
const LOC = () => isEN() ? "en-US" : "fr-FR";
const L = (fr, en) => isEN() ? en : fr;

/* ================= API ================= */
function apiConf(){
  return isOR() ? { url: "https://openrouter.ai/api/v1/chat/completions", or: true }
    : { url: (settings.baseUrl || "").trim().replace(/\/+$/, "").replace(/\/chat\/completions$/, "") + "/chat/completions", or: false };
}
async function callModel(messages, opts = {}){
  if(!settings.apiKey) throw new Error("Ajoute ta clé API dans les réglages");
  const { url, or } = apiConf();
  const body = { model: settings.model.trim(), messages, stream: !!opts.onDelta || opts.stream === true,
    max_tokens: opts.max_tokens ?? settings.max_tokens, temperature: opts.temperature ?? settings.temperature, top_p: opts.top_p ?? settings.top_p };
  if(!opts.plain){
    if(settings.presence_penalty) body.presence_penalty = settings.presence_penalty;
    if(settings.frequency_penalty) body.frequency_penalty = settings.frequency_penalty;
  }
  if(or){
    body.usage = { include: true };
    if(!opts.plain){
      if(settings.top_k > 0) body.top_k = settings.top_k;
      if(settings.min_p > 0) body.min_p = settings.min_p;
      if(settings.repetition_penalty !== 1) body.repetition_penalty = settings.repetition_penalty;
      if(settings.requireParams) body.provider = { require_parameters: true };
    }
    if(settings.noReasoning) body.reasoning = { enabled: false, exclude: true };
  }
  const mid = body.model.toLowerCase();
  if(/^anthropic\//.test(mid)){ delete body.top_p; delete body.top_k; delete body.min_p; delete body.presence_penalty; delete body.frequency_penalty; delete body.repetition_penalty; }
  if(/^google\/gemini-3/.test(mid)){ delete body.temperature; delete body.top_p; delete body.top_k; delete body.min_p; delete body.presence_penalty; delete body.frequency_penalty; delete body.repetition_penalty; }
  const send = () => fetch(url, {
    method: "POST", signal: opts.signal,
    headers: Object.assign({ "Authorization": "Bearer " + settings.apiKey.trim(), "Content-Type": "application/json" }, or ? { "X-Title": "Lanterne" } : {}),
    body: JSON.stringify(body)
  });
  let res = await send();
  if(!res.ok){
    let j = null; try{ j = await res.json(); }catch(e){}
    let msg = (j && j.error && (j.error.message || j.error)) || ("HTTP " + res.status);
    if(body.reasoning && /reason|think/i.test(String(msg))){ delete body.reasoning; res = await send(); if(!res.ok){ try{ j = await res.json(); }catch(e){} msg = (j && j.error && (j.error.message || j.error)) || ("HTTP " + res.status); } }
    if(!res.ok) throw new Error(msg);
  }
  let text = "", cost = 0, usage = null;
  if(!body.stream){
    const j = await res.json();
    if(j.error) throw new Error(j.error.message || "Erreur du fournisseur");
    text = j.choices?.[0]?.message?.content || ""; usage = j.usage || null;
  } else {
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    while(true){
      const { done, value } = await reader.read(); if(done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while((nl = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if(!line.startsWith("data:")) continue;
        const data = line.slice(5).trim(); if(data === "[DONE]") continue;
        let j; try{ j = JSON.parse(data); }catch(e){ continue; }
        if(j.error) throw new Error(j.error.message || "Erreur du fournisseur");
        const delta = j.choices?.[0]?.delta?.content;
        if(delta){ text += delta; opts.onDelta?.(delta); }
        if(j.usage) usage = j.usage;
      }
    }
  }
  if(usage?.cost != null) cost = Number(usage.cost);
  addCost(cost);
  return { text: text.replace(/<think>[\s\S]*?<\/think>/g, ""), cost, usage };
}
async function complete(prompt, max_tokens){
  const r = await callModel([{ role: "user", content: prompt }], { max_tokens, temperature: 0.9, top_p: 0.95, plain: true });
  return r.text.trim();
}
function parseJSON(t){
  t = t.replace(/```(?:json)?/gi, "");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if(a < 0 || b < a) throw new Error("réponse illisible, réessaie");
  return JSON.parse(t.slice(a, b + 1));
}
const looksFrench = s => /[àâçéèêëîïôûùüÿœ]|\b(le|la|les|une|des|et|est|dans|qui)\b/i.test(s);
async function generateScenario(d, idea){
  const existing = [d.title && "Title: " + d.title, d.opening && "Opening: " + d.opening, d.essentials && "Plot essentials: " + d.essentials].filter(Boolean).join("\n");
  const prompt =
`Create a scenario for an interactive text adventure (second person, the player is "you").
Player's idea: ${idea.trim() || "none — invent something original and compelling, any genre"}
${existing ? "Keep and build on what the player already wrote:\n" + existing + "\n" : ""}
Write everything in ${isEN() ? "English" : (!idea.trim() || looksFrench(idea + existing)) ? "French" : "the same language as the player's idea"}.
Return ONLY a JSON object, no other text:
{
 "title": "short evocative title",
 "opening": "the first 2-3 paragraphs of the story, second person, ends on a moment where the player can act",
 "essentials": "who the player is, the setting, key relationships and stakes — concise, factual, 4-8 lines",
 "authorsNote": "one or two short sentences on tone, pacing and style"
}`;
  return parseJSON(await complete(prompt, 1800));
}
async function generateCardEntry(card, ctx){
  const prompt =
`Write a story card (world info entry) for an interactive story.
Story context:
${ctx || "(none)"}
Card: ${card.title || "(invent a name)"} — type: ${card.type}${card.entry ? "\nNotes from the player to keep: " + card.entry : ""}
Return ONLY JSON: {"title": "...", "keys": "comma, separated, trigger words incl. the name", "entry": "concise factual description: appearance, personality, motives, secrets — STRICTLY under ${Math.round(settings.cardLimit * 0.9)} characters"}
Write in the language of the context (${isEN() ? "English" : "French"} if unsure).`;
  return parseJSON(await complete(prompt, 600));
}
async function generateInstructions(wish, current){
  const prompt =
`Rewrite the narrator instructions (system prompt) of an interactive text adventure to match the player's wishes.
Player's wishes: ${wish.trim() || "make them richer and more immersive"}
Current instructions:
"""
${current || DEFAULT_INSTRUCTIONS}
"""
Rules:
- Keep these technical rules in substance: lines starting with ">" are the player's actions (a quoted line is speech); never act, speak or decide for the player character; stop at a point where the player can act; write in the same language as the story.
- Add concrete guidance about style, tone, pacing, dialogue and content matching the wishes.
- Write the instructions in ${isEN() ? "English" : "French"}, as a short intro line followed by a concise bullet list (8-14 bullets).
Return ONLY the instructions, no preamble.`;
  return (await complete(prompt, 900)).replace(/^["“]|["”]$/g, "").trim();

function formatPlayer(type, text){
  text = text.trim();
  if(type === "say") return `> « ${text.replace(/^["“«]\s*|\s*["”»]$/g, "")} »`;
  if(type === "do") return "> " + text;
  return text;
}
function triggeredCards(){
  const recent = adv.actions.slice(-settings.cardScanDepth).map(a => a.text).join("\n").toLowerCase();
  return adv.cards.filter(c => c.enabled !== false && !isSystem(c) && !isBrain(c) && visible(c.entry) &&
    (c.keys || "").split(",").map(k => k.trim().toLowerCase()).filter(Boolean).some(k => recent.includes(k)));
}
function buildMessages(guide){
  const parts = [];
  if(adv.essentials.trim()) parts.push("[Plot essentials]\n" + adv.essentials.trim());
  if(adv.summary.trim()) parts.push("[Story summary so far]\n" + adv.summary.trim());
  const cards = triggeredCards();
  if(cards.length) parts.push("[World info]\n" + cards.map(c => `- ${cardName(c)}: ${c.entry.trim()}`).join("\n"));
  const extra = [mindBlock(adv), rpgBlock(adv), arNote(adv)].filter(Boolean).join("\n\n");
  const system = (adv.instructions.trim() || DEFAULT_INSTRUCTIONS) + (parts.length ? "\n\n" + parts.join("\n\n") : "") + (extra ? "\n\n" + extra : "");
  const an = adv.authorsNote.trim() ? `[Author's note: ${adv.authorsNote.trim()}]` : "";
  let budget = settings.contextTokens - estTok(system) - estTok(an) - settings.max_tokens - 50;
  const hist = [];
  const acts = adv.actions.filter(a => !a.hidden);
  for(let i = acts.length - 1; i >= 0; i--){
    const a = acts[i]; const t = estTok(a.text);
    if(budget - t < 0 && hist.length) break;
    budget -= t; hist.unshift(a);
  }
  const msgs = [];
  const push = (role, content) => {
    const last = msgs[msgs.length - 1];
    if(last && last.role === role) last.content += "\n\n" + content; else msgs.push({ role, content });
  };
  const ra = rollAction(acts);
  hist.forEach(a => push(a.type === "ai" ? "assistant" : "user", visible(a.text) + (a === ra ? "\n" + rollNote(a.roll) : "")));
  if(!msgs.length || msgs[msgs.length - 1].role === "assistant") push("user", "(Continue the story.)");
  if(msgs[0].role === "assistant") msgs.unshift({ role: "user", content: "(Begin.)" });
  if(an){ const last = msgs[msgs.length - 1]; last.content = an + "\n\n" + last.content; }
  if(guide){ const last = msgs[msgs.length - 1]; last.content += "\n\n" + guideNote(guide); }
  return [{ role: "system", content: system }, ...msgs];
}
function rollAction(list){
  if(!adv.scripts.rpg) return null;
  for(let i = list.length - 1; i >= 0; i--){ if(list[i].type === "ai" && !list[i].hidden) return null; if(list[i].roll) return list[i]; }
  return null;
}
/* AI Dungeon–style single-text context, used when scripts are enabled */
const ctxCharLimit = () => Math.max(6000, Math.floor((settings.contextTokens - settings.max_tokens) * 3.5));
const guideNote = g => `[Direction from the player for what happens next — follow it naturally, never mention it: ${g.trim()}]`;
function buildAIDContext(){
  const limit = ctxCharLimit();
  const top = [];
  if(adv.essentials.trim()) top.push(adv.essentials.trim());
  const cards = triggeredCards();
  if(cards.length) top.push("World Lore:\n" + cards.map(c => c.entry.trim()).join("\n\n"));
  if(adv.summary.trim()) top.push("Story Summary:\n" + adv.summary.trim());
  const head = top.join("\n\n");
  const an = adv.authorsNote.trim() ? `[Author's note: ${adv.authorsNote.trim()}]` : "";
  let budget = limit - head.length - an.length - 40;
  const parts = [];
  const ra = rollAction(adv.actions);
  for(let i = adv.actions.length - 1; i >= 0; i--){
    const t = adv.actions[i].text.replace(/^\s+|\s+$/g, "") + (adv.actions[i] === ra ? "\n" + rollNote(ra.roll) : "");
    if(!t) continue;
    if(budget - t.length < 0 && parts.length) break;
    budget -= t.length; parts.unshift(t);
  }
  if(an) parts.splice(Math.max(0, parts.length - 1), 0, an);

}

const wpend = new Map();
function getWorker(){

async function generate(input, opts = {}){
  if(!settings.apiKey){ toast("Ajoute ta clé API dans les réglages"); openSettings(); return; }
  hideIdeas(); stopSpeaking();
  generating = new AbortController(); updateTools();
  const signal = generating.signal;
  let errMsg = null, final = null, finalAction = null;
  const guide = input?.kind === "guide" ? input.raw.trim() : (opts.guide || "");
  if(input?.kind === "guide") input = null;
  const playerText = input ? input.raw : "";
  try{
    if(!scriptsOn()){
      if(input){ const pa = { id: uid(), type: input.kind === "story" ? "story" : "player", kind: input.kind, text: formatPlayer(input.kind, input.raw) }; if(wantsRoll(input)) pa.roll = d20(); adv.actions.push(pa); }
      renderStory(true);
      const ph = placeholder();
      if(guide) ph.setStatus("🧭 guidé");
      const view = $("#storyView");
      const msgs0 = buildMessages(guide);
      let r, attempt = 0;
      lastCost = 0;
      while(true){
        let started = false, cut = false, partial = "";
        try{
          r = await callModel(attempt ? withRepeatNote(msgs0) : msgs0, { signal, onDelta: delta => {
            partial += delta;
            if(cut) return;
            const mi = partial.search(/⟦|\[\[/);
            if(mi >= 0){ cut = true; const keep = delta.length - (partial.length - mi); delta = keep > 0 ? delta.slice(0, keep) : ""; if(!delta) return; }
            if(!started){ delta = delta.replace(/^\s+/, ""); if(!delta) return; started = true; ph.el.innerHTML = ""; }
            const stick = view.scrollHeight - view.scrollTop - view.clientHeight < 80;
            const sp = el("span", "fi"); sp.textContent = delta; ph.el.appendChild(sp);
            if(stick) view.scrollTop = view.scrollHeight;
          } });
        }catch(e){ if(e.name === "AbortError") r = { text: partial, cost: 0 }; else throw e; }
        lastCost += r.cost || 0;
        if(!attempt && adv.scripts.ar && adv.scripts.arRetry !== false && !signal.aborted && isRepeat(extractRpg(r.text).text)){
          attempt = 1; ph.el.innerHTML = `<span class="wait"><i></i><i></i><i></i></span><span class="wstat"></span>`; ph.setStatus("Répétition détectée, nouvelle version…");
          continue;
        }
        break;
      }
      const ex = extractRpg(r.text);
      final = cleanOutput(ex.text);
      if(final){ finalAction = { id: uid(), type: "ai", text: final }; if(adv.scripts.rpg) applyRpgTo(adv, finalAction, ex.ops); adv.actions.push(finalAction); }
    } else {
      if(input){
        const ri = await runHook("input", formatPlayer(input.kind, input.raw));
        const pa = { id: uid(), type: input.kind === "story" ? "story" : "player", kind: input.kind, text: ri.text }; if(wantsRoll(input)) pa.roll = d20();
        adv.actions.push(pa);
      }
      renderStory(true);
      const ph = placeholder();
      lastCost = 0;
      for(let loop = 0; loop < 10; loop++){
        if(signal.aborted) break;
        const logStart = scriptLogs.length;
        const c = await runHook("context", buildAIDContext(), { maxChars: ctxCharLimit() });
        const agent = (adv.scriptState?.InnerSelf?.agent || "").trim();
        const gen = scriptLogs.slice(logStart).map(l => l.match(/Generating card for '([^']+)'/)).find(Boolean);
        ph.setStatus(gen ? `✨ Création de la carte « ${gen[1]} »…` : agent ? `🎭 ${agent} réfléchit…` : loop ? "✨ Auto-Cards travaille…" : guide ? "🧭 guidé" : "");
        if(c.stop) break;
        const ctxText = guide && !gen ? c.text + "\n\n" + guideNote(guide) : c.text;
        const r = await callModel(scriptMessages(ctxText), { signal, stream: true });
        lastCost += r.cost || 0;
        const ex = extractRpg(r.text);
        const o = await runHook("output", cleanOutput(ex.text));
        const out = { id: uid(), type: "ai", text: o.text || "" };
        if(/>>>[\s\S]*please select[\s\S]*<<</i.test(out.text)){
          out.hidden = true; adv.actions.push(out); saveAdv();
          ph.setStatus("✨ Auto-Cards crée une carte…");
          continue;
        }
        if(visible(out.text)){ if(adv.scripts.rpg) applyRpgTo(adv, out, ex.ops); adv.actions.push(out); final = out.text; finalAction = out; }
        break;
      }
    }
  }catch(e){
    if(e.name !== "AbortError") errMsg = e.message;
  }
  if(finalAction){
    if(guide) finalAction.guide = guide;
    if(opts.alts?.length){ finalAction.alts = [...opts.alts, final]; finalAction.altIdx = finalAction.alts.length - 1; }
    recordTurn(final, playerText);
  } else if(opts.alts?.length && opts.restore){ adv.actions.push(opts.restore); if(opts.restore.rpgAfter) adv.rpg = clone(opts.restore.rpgAfter); }
  generating = null;
  saveAdv();
  renderStory(false);
  if(final && scriptsOn()){
    const last = [...$("#story").querySelectorAll(".act.ai")].pop();
    if(last) last.classList.add("fi");
  }
  if(errMsg){ const d = el("div", "err"); d.textContent = "⚠ " + errMsg; $("#story").insertBefore(d, $("#story .meta")); }

}

const STOPW = new Set(("le la les un une des de du et à au aux en dans sur sous par pour pas ne se sa son ses ton ta tes te tu toi vous il elle ils elles on qui que quoi dont où est était sont être avoir as ai avait avec comme mais ou donc ni car ce cet cette ces ça cela plus très tout tous toute toutes y lui leur leurs je me mon ma mes nous votre vos puis encore déjà même si bien " +
  "the a an of to and in is it you your that his her he she they them with as for on at by be was are this from").split(" "));
const toks = t => visible(t).toLowerCase().replace(/[’]/g, "'").replace(/[^\p{L}\p{N}'\s]/gu, " ").split(/\s+/).filter(Boolean);
function detectTics(a){
  const outs = a.actions.filter(x => x.type === "ai" && !x.hidden).slice(-12).map(x => toks(x.text));
  if(outs.length < 4) return [];
  const names = new Set([...userCards(a).flatMap(c => (c.keys + "," + cardName(c)).toLowerCase().split(/[,\s]+/)), ...Object.values(a.minds || {}).flatMap(m => [m.name, ...(m.aliases || [])].join(" ").toLowerCase().split(/\s+/))].filter(Boolean));
  const N = 4, df = new Map();
  const ok = g => g.filter(w => w.length > 2 && !STOPW.has(w) && !names.has(w)).length >= 2;
  outs.forEach(tk => { const seen = new Set(); for(let i = 0; i + N <= tk.length; i++){ const k = tk.slice(i, i + N).join(" "); if(!seen.has(k)){ seen.add(k); df.set(k, (df.get(k) || 0) + 1); } } });
  const freq = k => (df.get(k) || 0) >= 3;
  const spans = new Map();
  outs.forEach(tk => {
    let i = 0;
    while(i + N <= tk.length){
      if(!freq(tk.slice(i, i + N).join(" "))){ i++; continue; }
      let j = i; while(j + 1 + N <= tk.length && freq(tk.slice(j + 1, j + 1 + N).join(" "))) j++;
      const words = tk.slice(i, j + N);
      for(let c = 0; c < words.length; c += 12){ let w = words.slice(c, c + 12); if(w.length < N && c) w = words.slice(-N); if(ok(w)){ const k = w.join(" "); spans.set(k, (spans.get(k) || 0) + 1); } }
      i = j + N;
    }
  });
  const out = [];
  [...spans].sort((x, y) => y[1] - x[1] || y[0].length - x[0].length).forEach(([k]) => { if(out.length < 8 && !out.some(o => o.includes(k) || k.includes(o))) out.push(k); });
  return out;
}
function ticList(a){
  const off = a.arOff || [];
  const user = (a.arUser || "").split("\n").map(s => s.trim()).filter(Boolean);
  return [...detectTics(a).filter(p => !off.includes(p)), ...user];
}
function arNote(a){
  if(!a.scripts.ar) return "";
  const l = ticList(a);
  return `[Style — avoid repetition. ${l.length ? `These phrases are overused in this story, do NOT use them or close variants: ${l.map(p => `"${p}"`).join(", ")}. ` : ""}Vary sentence openings, gestures, reactions and imagery; never reuse a sentence from earlier in the story.]`;
}
function grams3(t){ const tk = toks(t), s = new Set(); for(let i = 0; i + 3 <= tk.length; i++) s.add(tk.slice(i, i + 3).join(" ")); return s; }
function isRepeat(text){
  const A = grams3(text); if(A.size < 10) return false;
  return adv.actions.filter(x => x.type === "ai" && !x.hidden).slice(-4).some(p => {
    const B = grams3(p.text); let k = 0; A.forEach(g => { if(B.has(g)) k++; }); return k / A.size > 0.4;
  });
}

  const m = msgs.map(x => Object.assign({}, x)); const last = m[m.length - 1];
  last.content += "\n\n[Your previous attempt copied earlier passages almost word for word. Write something genuinely new: new events, new wording, new imagery.]";
  return m;
}

const RPG_TAG = /(?:⟦|\[\[)([^⟧\]]{1,400})(?:⟧|\]\])?/g;
function extractRpg(text){
  const ops = []; const t = String(text || "").replace(RPG_TAG, (_, o) => { ops.push(o); return ""; }).replace(/\s+$/, "");

}
function applyRpgOps(r, ops){
  const d = [];
  const findIdx = (list, name) => { const l = name.toLowerCase(); let i = list.findIndex(x => x.toLowerCase() === l); if(i < 0) i = list.findIndex(x => x.toLowerCase().includes(l) || l.includes(x.toLowerCase())); return i; };

    const absent = known.filter(m => !present.has(m.name) && (m.goals?.short || m.goals?.long || m.plan) && a.actions.length - (m.lastSeen || 0) >= 6)
      .sort((x, y) => (x.lastSeen || 0) - (y.lastSeen || 0)).slice(0, 2);
    const cardsHint = userCards(a).filter(c => c.type === "personnage").map(c => `${cardName(c)}: ${visible(c.entry).slice(0, 200)}`).join("\n");
    const lang = isEN() ? "English" : "French";
    const prompt =
`You manage the inner lives of the characters of an interactive story. The player is "you"${a.scripts.player ? ` (named ${a.scripts.player})` : ""} and must never get a mind.
Plot essentials: ${visible(a.essentials).slice(0, 1200) || "(none)"}
Character cards:
${cardsHint || "(none)"}
Current minds of the characters in the scene (JSON):
${JSON.stringify(full)}
Other known characters: ${known.filter(m => !present.has(m.name)).map(m => m.name).join(", ") || "(none)"}

Recent story:
"""
${story}
"""

For each important named character who appears or acts in the recent story (not the player, not crowds or one-off extras), return their updated mind:
- name: as written in the story
- mood: one short phrase
- rel: how their attitude toward the player CHANGED in this passage, integers from -2 to +2 for trust, affection, fear, tension (0 if unchanged)
- goals: {"short": what they want right now, "long": their deeper goal} — keep the previous ones unless they changed
- plan: what they intend to do next
- learned: new facts this character now knows because they witnessed them or were told (never things they could not know)
- knows: null, unless their knowledge list has more than 10 items: then return the full condensed list (max 8)
- secrets: what they hide (full list, max 3)
- voice: how they talk (vocabulary, tics, register) — for new characters, or if it changed; otherwise ""
- thought: their current private thought, one sentence, first person
${absent.length ? `Then, for these ABSENT characters, advance their life off-screen, consistent with their goals and plan: ${absent.map(m => `${m.name} (goal: ${m.goals?.short || m.goals?.long || "?"}; plan: ${m.plan || "?"})`).join("; ")}. Return what they did since the player last saw them (1 sentence) and their new plan.` : ""}
Write every text value in the language of the story (${lang} if unsure). Keep everything concise.
Return ONLY JSON:
{"characters":[{"name":"","mood":"","rel":{"trust":0,"affection":0,"fear":0,"tension":0},"goals":{"short":"","long":""},"plan":"","learned":[],"knows":null,"secrets":[],"voice":"","thought":""}],
 "offscreen":[{"name":"","offscreen":"","plan":""}]}`;
    const r = parseJSON(await complete(prompt, 2400));
    const deltas = [];
    const player = (a.scripts.player || "").trim();
    (r.characters || []).forEach(c => {
      if(!c || !visible(c.name) || /^(you|tu|toi|vous|player|joueur)$/i.test(c.name.trim()) || (player && sameName(player, c.name))) return;
      let m = findMind(a, c.name);
      if(!m){ m = a.minds[mindKey(c.name)] = MIND_DEF(visible(c.name)); }
      if(c.mood) m.mood = visible(c.mood).slice(0, 80);
      REL.forEach(([k, fr, en, lo, hi]) => {
        const d = Math.max(-2, Math.min(2, parseInt(c.rel?.[k]) || 0)); if(!d) return;
        const before = m.rel[k] || 0; m.rel[k] = Math.max(lo, Math.min(hi, before + d));
        const real = m.rel[k] - before;
        if(real) deltas.push({ t: `${m.name} · ${L(fr, en)} ${signed(real)}`, s: (k === "fear" || k === "tension") ? -Math.sign(real) : Math.sign(real) });
      });
      if(c.goals){ if(visible(c.goals.short)) m.goals.short = visible(c.goals.short).slice(0, 160); if(visible(c.goals.long)) m.goals.long = visible(c.goals.long).slice(0, 160); }
      if(visible(c.plan)) m.plan = visible(c.plan).slice(0, 200);
      if(Array.isArray(c.knows) && c.knows.length) m.knows = c.knows.map(x => visible(x).slice(0, 160)).filter(Boolean).slice(0, 10);
      if(Array.isArray(c.learned)) c.learned.map(x => visible(x).slice(0, 160)).filter(x => x && !m.knows.some(k => sameName(k, x))).forEach(x => m.knows.push(x));
      if(m.knows.length > 14) m.knows = m.knows.slice(-14);
      if(Array.isArray(c.secrets) && c.secrets.length) m.secrets = c.secrets.map(x => visible(x).slice(0, 160)).filter(Boolean).slice(0, 3);
      if(visible(c.voice)) m.voice = visible(c.voice).slice(0, 200);
      if(visible(c.thought)) m.thought = visible(c.thought).slice(0, 240);
      m.offscreen = ""; m.lastSeen = a.actions.length; m.updated = Date.now();
    });
    (r.offscreen || []).forEach(o => {
      const m = o && findMind(a, o.name); if(!m || present.has(m.name)) return;
      if(visible(o.offscreen)) m.offscreen = visible(o.offscreen).slice(0, 240);
      if(visible(o.plan)) m.plan = visible(o.plan).slice(0, 200);
    });
    const lastAi = [...a.actions].reverse().find(x => x.type === "ai" && !x.hidden);
    if(lastAi && deltas.length) lastAi.mindDelta = [...(lastAi.mindDelta || []), ...deltas].slice(-8);
    a.mindFrom = a.actions.length;
    if(adv === a){ saveAdv(); if(!generating) renderStory(false); } else LS.set("lan.adv." + a.id, a);
    if(force) toast(L("Esprits mis à jour", "Minds updated"));
  }catch(e){ console.warn("minds", e); if(force) toast(L("Analyse impossible : ", "Analysis failed: ") + e.message); }
  minding = false; refreshSmartBar();
}
function relBar(k, v, lo, hi, label){
  const pct = (v - lo) / (hi - lo) * 100, mid = lo < 0 ? 50 : 0;
  const left = Math.min(pct, mid), width = Math.abs(pct - mid);
  return `<div class="relr"><span>${label}</span><div class="relb${lo < 0 ? " c" : ""}"><i class="${k}" style="left:${left}%;width:${Math.max(width, 1.5)}%"></i></div><b>${lo < 0 ? signed(v) : v}</b></div>`;
}

function openMindList(onlyPresent){
  const render = (_, b) => {
    b.innerHTML = "";

function seedMindsFromBrains(a){
  if(a.mindsSeeded) return; a.mindsSeeded = true;
  a.cards.filter(isBrain).forEach(c => {
    const name = cardName(c); if(!name || name === L("(sans titre)", "(untitled)")) return;
    const m = a.minds[mindKey(name)] ||= MIND_DEF(name);
    const t = visible(c.description).replace(/^\{\}$/, "");
    if(t && !m.thought) m.thought = t.split("\n").pop().replace(/^[^→]*→\s*/, "").slice(0, 240);
  });

  try{
    const recent = adv.actions.filter(a => !a.hidden).slice(-8).map(a => visible(a.text)).join("\n\n").slice(-5000);
    const prompt =
`Interactive story (the player is "you"). Context:
${adv.essentials ? "[Essentials] " + adv.essentials.slice(0, 1500) + "\n" : ""}[Recent story]
${recent}

Suggest 3 different, interesting actions the player could take next: one bold, one cautious or social, one surprising. Each under 12 words, written as the player's action without "you"/"tu" at the start (e.g. ${isEN() ? '"search the captain\'s desk"' : '"fouille le bureau du capitaine"'}). Same language as the story (${isEN() ? "English" : "French"} if unsure).

  }catch(e){ hideIdeas(); toast("Idées indisponibles : " + e.message); }
}

let liveVoices = null;
async function loadLiveVoices(){
  if(liveVoices) return liveVoices;
  try{
    const r = await fetch("https://openrouter.ai/api/v1/models?output_modalities=speech");
    const j = await r.json(); liveVoices = {};
    (j.data || []).forEach(m => { if(Array.isArray(m.supported_voices)) liveVoices[m.id] = m.supported_voices; });
  }catch(e){ liveVoices = {}; }
  return liveVoices;
}
function engineVoices(key, lang){
  const e = TTS[key]; if(!e || e.free) return [];
  const live = liveVoices?.[e.model];
  if(live?.length){
    const l = [...new Set(live.map(e.short).filter(v => e.isLang(v, lang)))];
    if(l.length){ const cur = e.voices[lang].filter(v => l.includes(v)); return [...cur, ...l.filter(v => !cur.includes(v))]; }
  }
  return e.voices[lang];
}
function chosenVoice(key, lang){ return settings.ttsVoices?.[key]?.[lang] || engineVoices(key, lang)[0]; }

function loadVoices(){ voices = synth ? synth.getVoices() : []; }
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }
const voiceScore = v => (/^fr/i.test(v.lang) ? 100 : /^en/i.test(v.lang) ? 50 : 0) + (/natural|neural|premium|enhanced|online|google/i.test(v.name) ? 10 : 0);
function sortedVoices(){ return [...voices].filter(v => /^(fr|en)/i.test(v.lang)).sort((a, b) => voiceScore(b) - voiceScore(a) || a.name.localeCompare(b.name)); }
function pickVoice(lang){ const l = sortedVoices(); return l.find(v => v.voiceURI === settings.voiceURI && v.lang.startsWith(lang)) || l.find(v => v.lang.startsWith(lang)) || l[0] || null; }
/* playback */
const audioCache = new Map();
let player = null, playToken = 0;
const speaking = () => !!(player || (synth && (synth.speaking || synth.pending)));
function setTtsBtn(on){ const b = $("#ttsBtn span"); if(b) b.textContent = on ? "Stop" : "Écouter"; }
function stopSpeaking(){
  playToken++;
  if(player){ try{ player.pause(); }catch(e){} player = null; }
  if(synth) synth.cancel();
  setTtsBtn(false);
}
function cleanForSpeech(text){ return visible(text).replace(/^>\s*/gm, "").replace(/[*_#~`]/g, "").replace(/\s+\n/g, "\n"); }
function chunksOf(t, max){
  const parts = t.match(/[^.!?…\n]+[.!?…]*["»”]?\s*/g) || [t];
  const out = []; let cur = "";
  parts.forEach(p => { if((cur + p).length > max && cur){ out.push(cur.trim()); cur = ""; } cur += p; });
  if(cur.trim()) out.push(cur.trim());
  return out;
}
async function ttsFetch(key, voice, text, signalToken){
  const e = TTS[key];
  const ck = key + "|" + voice + "|" + settings.ttsRate + "|" + text;
  if(audioCache.has(ck)) return audioCache.get(ck);
  const body = { model: e.model, input: text, voice: e.full(voice), response_format: "mp3" };
  if(e.speed && settings.ttsRate !== 1) body.speed = settings.ttsRate;
  const r = await fetch("https://openrouter.ai/api/v1/audio/speech", { method: "POST",
    headers: { "Authorization": "Bearer " + settings.apiKey.trim(), "Content-Type": "application/json", "X-Title": "Lanterne" }, body: JSON.stringify(body) });
  if(!r.ok){ let j = null; try{ j = await r.json(); }catch(x){} throw new Error((j && j.error && (j.error.message || j.error)) || ("HTTP " + r.status)); }
  const url = URL.createObjectURL(await r.blob());
  addCost(text.length * e.perChar); saveAdv();
  audioCache.set(ck, url);
  if(audioCache.size > 40){ const k0 = audioCache.keys().next().value; URL.revokeObjectURL(audioCache.get(k0)); audioCache.delete(k0); }
  return url;
}
async function speak(text, langOverride){
  stopSpeaking();
  const t = cleanForSpeech(text); if(!t) return;
  const lang = langOverride || (looksFrench(t) ? "fr" : "en");
  const key = settings.ttsEngine || "mai";
  if(key === "device" || !TTS[key] || !settings.apiKey || !isOR()) return speakDevice(t, lang);
  const token = playToken; setTtsBtn(true);
  const voice = chosenVoice(key, lang);
  const chunks = chunksOf(t, 900);
  try{
    let next = ttsFetch(key, voice, chunks[0]);
    for(let i = 0; i < chunks.length; i++){
      const url = await next;
      if(token !== playToken) return;
      if(i + 1 < chunks.length) next = ttsFetch(key, voice, chunks[i + 1]);
      await new Promise((res, rej) => {
        const a = new Audio(url); player = a;
        a.playbackRate = TTS[key].speed ? 1 : settings.ttsRate;
        a.onended = res; a.onerror = () => rej(new Error("lecture audio impossible"));
        a.play().catch(rej);
      });
      if(token !== playToken) return;
    }
  }catch(e){ if(token === playToken) toast("Voix : " + e.message); }
  if(token === playToken){ player = null; setTtsBtn(false); }
}
function speakDevice(t, lang){
  if(!synth){ toast("La lecture vocale n'est pas disponible ici"); return; }
  const v = pickVoice(lang);
  const chunks = chunksOf(t, 220);
  chunks.forEach((c, i) => {
    const u = new SpeechSynthesisUtterance(c);
    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = lang === "fr" ? "fr-FR" : "en-US";
    u.rate = settings.ttsRate; u.pitch = settings.ttsPitch;
    if(i === chunks.length - 1){ u.onend = () => setTtsBtn(false); u.onerror = () => setTtsBtn(false); }
    synth.speak(u);
  });
  setTtsBtn(true);
}

/* ================= Search ================= */
function openSearch(){
  openSheet("Rechercher dans l'histoire", null, (_, b) => {
    const q = el("input"); q.placeholder = "Un nom, un lieu, un mot…"; q.type = "search"; q.style.marginBottom = "12px";
    b.appendChild(q);
    const res = el("div"); b.appendChild(res);
    const draw = () => {
      res.innerHTML = "";
      const term = q.value.trim();
      if(term.length < 2){ hint(res, "Tape au moins 2 lettres. Touche un résultat pour y aller."); return; }
      const norm = x => x.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
      const nt = norm(term);
      const acts = adv.actions.filter(a => !a.hidden);
      let n = 0;
      for(let i = acts.length - 1; i >= 0 && n < 50; i--){
        const t = visible(acts[i].text); const pos = norm(t).indexOf(nt);
        if(pos < 0) continue; n++;
        const s0 = Math.max(0, pos - 70), s1 = Math.min(t.length, pos + term.length + 90);
        const snip = (s0 ? "…" : "") + esc(t.slice(s0, pos)) + "<mark>" + esc(t.slice(pos, pos + term.length)) + "</mark>" + esc(t.slice(pos + term.length, s1)) + (s1 < t.length ? "…" : "");
        const r = el("button", "res", `<div class="rk">Passage ${i + 1} sur ${acts.length}${acts[i].type !== "ai" ? " · ton action" : ""}</div>${snip}`);
        const id = acts[i].id;
        r.onclick = () => { closeSheet(); const d = document.querySelector(`.act[data-id="${id}"]`); if(d){ d.scrollIntoView({ block: "center", behavior: "smooth" }); d.classList.remove("flash"); void d.offsetWidth; d.classList.add("flash"); } };
        res.appendChild(r);
      }
      if(!n) hint(res, "Aucun résultat.");
      else if(n >= 50) hint(res, "50 premiers résultats affichés, du plus récent au plus ancien.");
    };
    q.oninput = draw; draw(); setTimeout(() => q.focus(), 60);
  });
}

/* ================= Onboarding ================= */
function onboarding(force){
  if(!force && (LS.get("lan.onboarded", false) || index.length)) { LS.set("lan.onboarded", true); return; }
  const steps = [
    ["🏮", "Bienvenue dans Lanterne", "Des aventures et du jeu de rôle avec l'IA. Tu joues, elle raconte, et tout reste sur ton téléphone."],
    ["🔑", "Il te faut une clé API", "Crée un compte sur openrouter.ai, ajoute quelques euros de crédit, puis crée une clé et colle-la dans les réglages (icône en haut à droite). Un tour coûte une fraction de centime."],
    ["⚔️", "Comment jouer", "<b>Faire</b> pour agir, <b>Dire</b> pour parler, <b>Histoire</b> pour écrire toi-même la suite, <b>Guide</b> pour orienter l'IA sans que ça apparaisse. Touche un passage pour le modifier, et <b>Réessayer</b> garde toutes les versions."],
  ];
  let i = 0;
  const o = el("div", "ob"); document.body.appendChild(o);
  const done = () => { LS.set("lan.onboarded", true); o.remove(); };
  const draw = () => {
    const [em, t, p] = steps[i];
    o.innerHTML = `<div class="box"><div class="em">${em}</div><h3>${t}</h3><p>${p}</p><div class="row" style="justify-content:space-between"><div class="dots">${steps.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div><div class="row"><button class="btn ghost small" data-skip>${i < steps.length - 1 ? "Passer" : ""}</button><button class="btn small" data-next>${i < steps.length - 1 ? "Suivant" : "C'est parti"}</button></div></div></div>`;
    const sk = o.querySelector("[data-skip]"); if(!sk.textContent) sk.remove(); else sk.onclick = done;
    o.querySelector("[data-next]").onclick = () => { if(i < steps.length - 1){ i++; draw(); } else { done(); if(!settings.apiKey) openSettings(); } };
  };
  draw();
}

/* ================= Scenario sharing ================= */
function scenarioOf(a){
  const opening = a.actions.find(x => x.type === "ai" && !x.hidden);
  return { lanterne_scenario: 1, title: a.title, opening: opening ? visible(opening.text) : "", essentials: a.essentials, authorsNote: a.authorsNote,
    instructions: a.instructions, cards: a.cards.filter(c => !isBrain(c) && !isSystem(c)).map(c => ({ title: cardName(c), type: c.type, keys: c.keys, entry: c.entry })),
    scripts: { ac: !!a.scripts.ac, is: !!a.scripts.is, names: a.scripts.names || "", player: "" }, style: a.style,
    cover: a.hasCover ? getCover(a.id) : undefined, coverPos: a.coverPos };
}
async function shareScenario(){
  const sc = scenarioOf(adv);
  const name = `scenario-${slug(adv.title)}.json`;
  const blob = new Blob([JSON.stringify(sc, null, 2)], { type: "application/json" });
  try{
    const file = new File([blob], name, { type: "application/json" });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: adv.title, text: `Scénario Lanterne : ${adv.title}` });
      return;
    }
  }catch(e){ if(e.name === "AbortError") return; }
  download(name, sc);
  toast("Fichier téléchargé : envoie-le à tes potes");
}
function startFromScenario(sc){
  adventureWizard({
    title: sc.title || "", opening: sc.opening || "", essentials: sc.essentials || "", authorsNote: sc.authorsNote || "",
    instructions: sc.instructions || DEFAULT_INSTRUCTIONS,
    cards: (sc.cards || []).map(c => normalizeCard({ title: c.title, type: c.type, keys: c.keys, entry: c.entry })),
    scripts: Object.assign(SCRIPT_DEF(), sc.scripts || {}),
    cover: sc.cover || null, coverPos: sc.coverPos ?? 50, style: sc.style
  });
}
function importScenarioFile(){
  const i = document.createElement("input"); i.type = "file"; i.accept = "application/json,.json";
  i.onchange = async () => {
    try{
      const j = JSON.parse(await i.files[0].text());
      if(j.lanterne_scenario) startFromScenario(j);
      else if(j.adventures?.length) startFromScenario(scenarioOf(migrate(j.adventures[0])));
      else throw new Error("ce n'est pas un scénario Lanterne");
    }catch(e){ toast("Import impossible : " + e.message); }
  };
  i.click();
}

  const W = 800, H = 450;
  const rng = s => () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };

  const rad = (stops) => { const id = "r" + (++gid); return [id, `<radialGradient id="${id}">${stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}"${a != null ? ` stop-opacity="${a}"` : ""}/>`).join("")}</radialGradient>`]; };
  function ridge(r, y, amp, rough, fill, steps = 64){
    let pts = [], v = 0;
    for(let i = 0; i <= steps; i++){ v += (r() - .5) * rough; v *= .92; pts.push([i * W / steps, y + v * amp]); }
    return `<path d="M0 ${H}L${pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L")}L${W} ${H}Z" fill="${fill}"/>`;
  }
  function peaks(r, y, n, hmin, hmax, fill){
    let d = `M0 ${H}L0 ${y}`, x = 0;
    while(x < W){ const w = 60 + r() * (W / n); const h = hmin + r() * (hmax - hmin); d += `L${(x + w / 2).toFixed(0)} ${(y - h).toFixed(0)}L${(x + w).toFixed(0)} ${(y - r() * 20).toFixed(0)}`; x += w; }
    return `<path d="${d}L${W} ${H}Z" fill="${fill}"/>`;
  }

function wipeLocalSynced(){
  const ks = []; for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(SYNC_RE.test(k)) ks.push(k); }
  ks.forEach(k => localStorage.removeItem(k));
  ["lan.mtime", "lan.dirty", "lan.index", "lan.sync.last"].forEach(k => localStorage.removeItem(k));
  settings = Object.assign({}, DEFAULT_SETTINGS); index = []; stats = { total: 0, since: Date.now(), turns: 0, words: 0, playerWords: 0, byMonth: {}, byModel: {}, days: {} };
}
async function firstSync(){
  const owner = localStorage.getItem("lan.sync.owner");
  if(owner && owner !== auth.user.id) wipeLocalSynced(); // another account used this device before: start clean
  localStorage.setItem("lan.sync.owner", auth.user.id);
  // stamp existing local data so it can be merged with the account (newest wins)
  const m = LS.get("lan.mtime", {}), d = LS.get("lan.dirty", {});
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(!SYNC_RE.test(k)) continue;
    if(!m[k]){ const v = LS.get(k, null); m[k] = (v && v.updated) || 1; }
    d[k] = 1;
  }
  localStorage.setItem("lan.mtime", JSON.stringify(m)); localStorage.setItem("lan.dirty", JSON.stringify(d));
  localStorage.removeItem("lan.sync.last");
  await syncNow(true);
}
async function syncPush(){
  const dirty = LS.get("lan.dirty", {}), mt = LS.get("lan.mtime", {});
  const keys = Object.keys(dirty);
  if(!keys.length) return;
  const snap = {}, rows = [];
  for(const k of keys){
    snap[k] = mt[k] || Date.now();
    const raw = localStorage.getItem(k);
    let data = raw ? JSON.parse(raw) : null;
    if(k === "lan.settings" && data && !settings.syncApiKey){ data = Object.assign({}, data); delete data.apiKey; }
    rows.push({ user_id: auth.user.id, key: k.slice(4), data: raw ? await encData(data) : null, mtime: snap[k], deleted: !raw });
  }
  for(let i = 0; i < rows.length; i += 15){
    await sbFetch("/rest/v1/lanterne_docs?on_conflict=user_id,key", { method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows.slice(i, i + 15)) });
  }
  const now = LS.get("lan.mtime", {}), d2 = LS.get("lan.dirty", {});
  keys.forEach(k => { if((now[k] || 0) === snap[k]) delete d2[k]; });
  localStorage.setItem("lan.dirty", JSON.stringify(d2));
}
async function syncPull(){
  let last = localStorage.getItem("lan.sync.last") || "1970-01-01T00:00:00Z";
  const changed = []; let bad = 0;
  for(let page = 0; page < 20; page++){
    const rows = await sbFetch(`/rest/v1/lanterne_docs?select=key,data,mtime,deleted,updated_at&user_id=eq.${auth.user.id}&updated_at=gt.${encodeURIComponent(last)}&order=updated_at.asc&limit=200`);
    if(!rows || !rows.length) break;
    const mt = LS.get("lan.mtime", {}), dirty = LS.get("lan.dirty", {});
    for(const r of rows){
      last = r.updated_at;
      const k = "lan." + r.key;
      if(!SYNC_RE.test(k)) continue;
      if(Number(r.mtime) <= (mt[k] || 0)) continue;
      let plain = false;
      if(r.deleted) localStorage.removeItem(k);
      else{
        let data = r.data;
        if(data && data.e2e){ try{ data = await decData(data); }catch(e){ bad++; continue; } }
        else if(data != null) plain = true; // ancienne copie non chiffrée : on la renverra chiffrée
        if(k === "lan.settings" && data){ const cur = LS.get(k, {}); if(!data.apiKey && cur.apiKey) data = Object.assign({}, data, { apiKey: cur.apiKey }); }
        localStorage.setItem(k, JSON.stringify(data));
      }
      mt[k] = Number(r.mtime); if(plain) dirty[k] = 1; else delete dirty[k]; changed.push(k);
    }
    localStorage.setItem("lan.mtime", JSON.stringify(mt)); localStorage.setItem("lan.dirty", JSON.stringify(dirty));
    localStorage.setItem("lan.sync.last", last);
    if(rows.length < 200) break;
  }
  if(changed.length) applyPulled(changed);
  if(bad) throw new Error(`${bad} élément${bad > 1 ? "s" : ""} illisible${bad > 1 ? "s" : ""} (chiffré${bad > 1 ? "s" : ""} avec une autre clé)`);
}
function applyPulled(keys){
  let advChanged = false;
  keys.forEach(k => {
    if(k === "lan.settings") settings = Object.assign({}, DEFAULT_SETTINGS, LS.get("lan.settings", {}));
    else if(k === "lan.stats") stats = Object.assign({ total: 0, since: Date.now(), turns: 0, words: 0, playerWords: 0, byMonth: {}, byModel: {}, days: {} }, LS.get("lan.stats", {}));
    else{
      const id = k.replace(/^lan\.(adv|cover)\./, "");
      const a = LS.get("lan.adv." + id, null);
      index = index.filter(x => x.id !== id);
      if(a) index.push(indexEntry(a));
      if(adv && adv.id === id) advChanged = true;
    }
  });
  index.sort((x, y) => y.updated - x.updated);
  localStorage.setItem("lan.index", JSON.stringify(index));
  const sheetOpen = !!$("#sheetHost").innerHTML;
  if(sheetOpen && (!adv || advChanged)){ syncPendingUI = true; return; }
  if(!adv){ if(!$(".ob")) showLibrary(); }
  else if(advChanged && !generating){
    const a = LS.get("lan.adv." + adv.id, null);
    if(a){ adv = migrate(a); applyStyle(adv.style); setHeaderTitle(adv.title, false); renderStory(false); }
    else showLibrary();
  }
}
async function syncNow(manual){
  if(!auth || !syncConf().url || !hasKey()){ refreshSyncLine(); return; }
  if(!localStorage.getItem("lan.sync.owner")) localStorage.setItem("lan.sync.owner", auth.user.id);
  if(syncState.busy){ if(manual) toast("Synchronisation déjà en cours"); return; }
  syncState.busy = true; refreshSyncLine();
  try{
    await syncPush(); await syncPull(); await syncPush();
    syncState.err = ""; syncState.last = Date.now(); LS.set("lan.sync.when", syncState.last);
    if(manual) toast("Synchronisé ✓");
  }catch(e){
    syncState.err = /fetch|network/i.test(e.message) ? "hors ligne" : e.message;
    if(manual) toast("Synchro impossible : " + syncState.err);
  }
  syncState.busy = false; refreshSyncLine();
}
