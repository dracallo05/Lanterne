<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1f1e1c">
<title>Lanterne</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#1f1e1c; --bg2:#262624; --bg3:#30302e; --line:#3d3c39;
  --tx:#e8e6dc; --tx2:#b5b3aa; --tx3:#85837b;
  --acc:#d97757; --acc2:#e8957a; --ok:#7fae7a; --err:#e07a6a;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --fs:17px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:90px;line-height:1.45}
.hidden{display:none!important}
.app{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:6px;padding:10px 10px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg)}
header h1{flex:1;font-size:16px;font-weight:600;margin:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--tx2);flex:none}
.ib:active{background:var(--bg3)}
.ib svg{width:22px;height:22px}
main{flex:1;overflow-y:auto;overscroll-behavior:contain}
.pad{padding:16px}
/* Library */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.card .t{font-weight:600}
.card .s{color:var(--tx3);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .grow{flex:1;min-width:0}
.btn{background:var(--acc);color:#1b1410;font-weight:600;border-radius:12px;padding:12px 16px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--bg3);color:var(--tx)}
.btn.danger{background:transparent;color:var(--err);border:1px solid #5a3a35}
.row{display:flex;gap:8px;align-items:center}
.empty{color:var(--tx3);text-align:center;padding:40px 10px;line-height:1.6}
/* Story */
.story{padding:18px 18px 30px;font-family:var(--serif);font-size:var(--fs);line-height:1.62}
.act{white-space:pre-wrap;word-wrap:break-word;padding:2px 0;border-radius:6px}
.act.ai{color:var(--tx)}
.act.player{color:var(--acc2);font-style:italic;margin:12px 0}
.act.story-act{color:var(--tx)}
.act.sel{background:var(--bg3)}
.act + .act.ai{margin-top:0}
.caret::after{content:"▍";color:var(--acc);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.err{color:var(--err);font-family:var(--sans);font-size:14px;padding:8px 0}
.meta{color:var(--tx3);font-size:12px;font-family:var(--sans);text-align:center;padding:4px 0 0}
/* Input bar */
.bar{border-top:1px solid var(--line);background:var(--bg);padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.modes{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}
.mode{padding:6px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--tx2);font-size:13px;white-space:nowrap}
.mode.on{background:var(--acc);color:#1b1410;border-color:var(--acc);font-weight:600}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{min-height:44px;max-height:30vh;resize:none;border-radius:22px;padding:11px 16px}
.send{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#1b1410;display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
.send.stop{background:var(--bg3);color:var(--tx)}
.tools{display:flex;justify-content:space-around;margin-top:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tx2);font-size:11px;padding:4px 8px;border-radius:8px}
.tool svg{width:20px;height:20px}
.tool:active{background:var(--bg3)}
.tool:disabled{opacity:.35}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;max-height:92dvh;background:var(--bg);border-top-left-radius:20px;border-top-right-radius:20px;z-index:21;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:0}
.sheet .sh{display:flex;align-items:center;padding:10px 10px 0 16px}
.sheet .sh h2{flex:1;font-size:17px;margin:0}
.tabs{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tab{padding:8px 12px;border-radius:10px;color:var(--tx2);white-space:nowrap;font-size:14px}
.tab.on{background:var(--bg3);color:var(--tx)}
.sheet .body{overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
label.f{display:block;margin:0 0 16px}
label.f > span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px;font-weight:600}
.hint{color:var(--tx3);font-size:13px;line-height:1.45;margin:-2px 0 8px}
.sl{margin-bottom:18px}
.sl .top{display:flex;justify-content:space-between;align-items:baseline}
.sl .top b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.sl .top output{color:var(--tx);font-variant-numeric:tabular-nums}
input[type=range]{padding:0;border:0;background:transparent;height:30px;accent-color:var(--acc)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sw .l{flex:1}
.sw .l b{display:block;font-weight:500}
.sw .l small{color:var(--tx3);font-size:13px}
.tg{width:48px;height:28px;border-radius:999px;background:var(--bg3);position:relative;flex:none;border:1px solid var(--line)}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--tx3);transition:.15s}
.tg.on{background:var(--acc);border-color:var(--acc)}
.tg.on::after{left:23px;background:#1b1410}
.sc{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.sc .t{font-weight:600}
.sc .k{color:var(--acc2);font-size:12px;margin-top:2px}
.sc .e{color:var(--tx3);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
pre.ctx{white-space:pre-wrap;font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--tx2);max-height:60vh;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--bg3);color:var(--tx2)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90vw}
.menu{position:fixed;z-index:30;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:170px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.menu button{display:block;width:100%;text-align:left;padding:12px 16px}
.menu button:active{background:var(--bg3)}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="ib hidden" id="backBtn" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="title">Lanterne</h1>
    <button class="ib hidden" id="advBtn" aria-label="Aventure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 012-2h13v16H6a2 2 0 00-2 2.5zM4 19.5A2.5 2.5 0 016.5 22H19"/><path d="M9 7h6M9 11h6"/></svg></button>
    <button class="ib" id="setBtn" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </header>

  <main id="libView"><div class="pad" id="lib"></div></main>

  <main id="storyView" class="hidden"><div class="story" id="story"></div></main>
  <div class="bar hidden" id="bar">
    <div class="modes" id="modes">
      <button class="mode on" data-m="do">Faire</button>
      <button class="mode" data-m="say">Dire</button>
      <button class="mode" data-m="story">Histoire</button>
    </div>
    <div class="inrow">
      <textarea id="inp" rows="1" placeholder="Que fais-tu ?"></textarea>
      <button class="send" id="sendBtn" aria-label="Envoyer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
    <div class="tools">
      <button class="tool" id="contBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Continuer</button>
      <button class="tool" id="retryBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12a9 9 0 109-9 9.5 9.5 0 00-6.7 2.8L3 8"/><path d="M3 3v5h5"/></svg>Réessayer</button>
      <button class="tool" id="undoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>Annuler</button>
      <button class="tool" id="redoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg>Rétablir</button>
    </div>
  </div>
</div>

<div id="sheetHost"></div>

<script>
"use strict";
/* ================= Storage ================= */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ toast("Sauvegarde impossible : " + e.message); return false; } }
};
const DEFAULT_INSTRUCTIONS =
`You are the narrator of an interactive text adventure. The player controls the protagonist, addressed as "you".
Lines starting with ">" are the player's actions; a quoted line after ">" is something the player says. Other player lines are narration the player wrote and should be treated as canon.
- Continue the story from where it left off, reacting to the player's last action with vivid, grounded prose.
- Never act, speak or decide for the player character beyond what their action states. Stop at a natural point where the player can act.
- Keep characters consistent with their established personalities, goals and knowledge. NPCs have their own agency.
- Show, don't tell. Vary sentence rhythm. Avoid clichés, purple prose and repeating phrases from earlier in the story.
- Write 1 to 3 paragraphs. No meta commentary, no headings, no options lists.
- Write in the same language as the story.`;

const DEFAULT_SETTINGS = {
  apiKey: "", model: "deepseek/deepseek-v4-pro",
  max_tokens: 300, temperature: 0.8, top_p: 0.95, top_k: 0, min_p: 0,
  repetition_penalty: 1, presence_penalty: 0, frequency_penalty: 0,
  contextTokens: 16000, cardScanDepth: 4, requireParams: false, noReasoning: true,
  fontSize: 17
};
let settings = Object.assign({}, DEFAULT_SETTINGS, LS.get("lan.settings", {}));
let index = LS.get("lan.index", []); // [{id,title,updated,preview}]
let adv = null; // current adventure
let redoStack = [];
let mode = "do";
let generating = null; // AbortController
let lastUsage = null;

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const estTok = s => Math.ceil((s || "").length / 3.6);

function saveSettings(){ LS.set("lan.settings", settings); applyFont(); }
function applyFont(){ document.documentElement.style.setProperty("--fs", settings.fontSize + "px"); }
function saveAdv(){
  if(!adv) return;
  adv.updated = Date.now();
  LS.set("lan.adv." + adv.id, adv);
  const last = [...adv.actions].reverse().find(a => a.type === "ai");
  const entry = { id: adv.id, title: adv.title, updated: adv.updated, preview: (last ? last.text : adv.actions[0]?.text || "").slice(-160) };
  index = index.filter(x => x.id !== adv.id); index.unshift(entry);
  LS.set("lan.index", index);
}
function newAdventure(title, opening){
  return {
    id: uid(), title: title || "Nouvelle aventure", created: Date.now(), updated: Date.now(),
    instructions: DEFAULT_INSTRUCTIONS, essentials: "", authorsNote: "", summary: "",
    cards: [], actions: opening ? [{ id: uid(), type: "ai", text: opening.trim() }] : []
  };
}

/* ================= UI helpers ================= */
let toastT;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}
function closeSheet(){ $("#sheetHost").innerHTML = ""; }
function openSheet(title, tabs, renderTab, startTab){
  const host = $("#sheetHost");
  host.innerHTML = `<div class="scrim"></div><div class="sheet"><div class="sh"><h2>${esc(title)}</h2>
    <button class="ib" data-close aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    ${tabs ? `<div class="tabs">${tabs.map(t => `<button class="tab" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div>` : ""}
    <div class="body"></div></div>`;
  host.querySelector(".scrim").onclick = closeSheet;
  host.querySelector("[data-close]").onclick = closeSheet;
  const body = host.querySelector(".body");
  const show = k => {
    host.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === k));
    body.innerHTML = ""; body.scrollTop = 0; renderTab(k, body);
  };
  host.querySelectorAll(".tab").forEach(b => b.onclick = () => show(b.dataset.tab));
  show(startTab || (tabs ? tabs[0][0] : null));
}
function field(body, label, value, onInput, opts = {}){
  const l = document.createElement("label"); l.className = "f";
  l.innerHTML = `<span>${esc(label)}</span>${opts.hint ? `<div class="hint">${esc(opts.hint)}</div>` : ""}`;
  const el = document.createElement(opts.multiline ? "textarea" : "input");
  if(opts.type) el.type = opts.type;
  if(opts.rows) el.rows = opts.rows;
  if(opts.placeholder) el.placeholder = opts.placeholder;
  el.value = value ?? "";
  el.oninput = () => onInput(el.value);
  l.appendChild(el); body.appendChild(l);
  return el;
}
function slider(body, label, key, min, max, step, hint){
  const d = document.createElement("div"); d.className = "sl";
  d.innerHTML = `<div class="top"><b>${esc(label)}</b><output>${settings[key]}</output></div>${hint ? `<div class="hint">${esc(hint)}</div>` : ""}<input type="range" min="${min}" max="${max}" step="${step}" value="${settings[key]}">`;
  const r = d.querySelector("input"), o = d.querySelector("output");
  r.oninput = () => { settings[key] = Number(r.value); o.textContent = r.value; saveSettings(); };
  body.appendChild(d);
}
function toggle(body, label, sub, key){
  const d = document.createElement("div"); d.className = "sw";
  d.innerHTML = `<div class="l"><b>${esc(label)}</b><small>${esc(sub)}</small></div><button class="tg ${settings[key] ? "on" : ""}"></button>`;
  const b = d.querySelector(".tg");
  b.onclick = () => { settings[key] = !settings[key]; b.classList.toggle("on", settings[key]); saveSettings(); };
  body.appendChild(d);
}
function btn(body, text, cls, onClick){
  const b = document.createElement("button"); b.className = "btn " + (cls || ""); b.textContent = text; b.onclick = onClick;
  body.appendChild(b); return b;
}

/* ================= Library ================= */
function showLibrary(){
  stopGen(); adv = null;
  $("#libView").classList.remove("hidden");
  $("#storyView").classList.add("hidden"); $("#bar").classList.add("hidden");
  $("#backBtn").classList.add("hidden"); $("#advBtn").classList.add("hidden");
  $("#title").textContent = "Lanterne";
  const lib = $("#lib");
  lib.innerHTML = "";
  const top = document.createElement("div"); top.className = "row"; top.style.marginBottom = "16px";
  lib.appendChild(top);
  btn(top, "+ Nouvelle aventure", "", newAdventureSheet).style.flex = "1";
  if(!settings.apiKey){
    const w = document.createElement("div"); w.className = "card";
    w.innerHTML = `<div class="grow"><div class="t">Ajoute ta clé OpenRouter</div><div class="s">Touche ici, ou l'icône réglages en haut à droite. La clé reste sur ce téléphone.</div></div>`;
    w.onclick = openSettings; lib.appendChild(w);
  }
  if(!index.length){
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = "Aucune aventure pour l'instant.<br>Crée-en une pour commencer.";
    lib.appendChild(e); return;
  }
  index.sort((a, b) => b.updated - a.updated).forEach(x => {
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<div class="grow"><div class="t">${esc(x.title)}</div><div class="s">${esc(x.preview)}</div></div>`;
    c.onclick = () => openAdventure(x.id);
    lib.appendChild(c);
  });
}
function newAdventureSheet(){
  let title = "", opening = "", essentials = "";
  openSheet("Nouvelle aventure", null, (_, body) => {
    field(body, "Titre", "", v => title = v, { placeholder: "La tour d'obsidienne" });
    field(body, "Texte d'ouverture", "", v => opening = v, { multiline: true, rows: 6, hint: "Le début de l'histoire, écrit à la 2e personne. L'IA continuera à partir de là.", placeholder: "Tu es Kaelen, une mage de Conjuration en exil. La pluie tombe sur les remparts de..." });
    field(body, "Plot Essentials", "", v => essentials = v, { multiline: true, rows: 4, hint: "Ce que l'IA doit toujours savoir : qui tu es, le monde, l'objectif. Modifiable plus tard." });
    btn(body, "Commencer", "", () => {
      const a = newAdventure(title.trim(), opening);
      a.essentials = essentials;
      adv = a; saveAdv(); closeSheet(); openAdventure(a.id);
    }).style.width = "100%";
  });
}

/* ================= Story view ================= */
function openAdventure(id){
  const a = LS.get("lan.adv." + id, null);
  if(!a){ toast("Aventure introuvable"); index = index.filter(x => x.id !== id); LS.set("lan.index", index); return showLibrary(); }
  adv = a; redoStack = []; lastUsage = null;
  $("#libView").classList.add("hidden");
  $("#storyView").classList.remove("hidden"); $("#bar").classList.remove("hidden");
  $("#backBtn").classList.remove("hidden"); $("#advBtn").classList.remove("hidden");
  $("#title").textContent = adv.title;
  renderStory(true);
}
function actionDisplay(a){ return a.text; }
function renderStory(scroll){
  const s = $("#story"); s.innerHTML = "";
  adv.actions.forEach(a => {
    const d = document.createElement("div");
    d.className = "act " + (a.type === "ai" ? "ai" : a.type === "story" ? "story-act" : "player");
    d.dataset.id = a.id;
    d.textContent = actionDisplay(a);
    d.addEventListener("click", ev => actionMenu(a, ev));
    s.appendChild(d);
  });
  if(!adv.actions.length){
    s.innerHTML = `<div class="empty" style="font-family:var(--sans)">L'histoire est vide. Écris une action, ou passe en mode <b>Histoire</b> pour poser la scène.</div>`;
  }
  if(lastUsage){
    const m = document.createElement("div"); m.className = "meta"; m.id = "usage";
    m.textContent = lastUsage; s.appendChild(m);
  }
  updateTools();
  if(scroll) requestAnimationFrame(() => { const v = $("#storyView"); v.scrollTop = v.scrollHeight; });
}
function updateTools(){
  const busy = !!generating;
  $("#undoBtn").disabled = busy || !adv?.actions.length;
  $("#redoBtn").disabled = busy || !redoStack.length;
  $("#retryBtn").disabled = busy || !adv?.actions.some(a => a.type === "ai");
  $("#contBtn").disabled = busy;
  const sb = $("#sendBtn");
  sb.classList.toggle("stop", busy);
  sb.innerHTML = busy
    ? `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`;
}
function actionMenu(a, ev){
  if(generating) return;
  document.querySelectorAll(".menu").forEach(m => m.remove());
  document.querySelectorAll(".act.sel").forEach(m => m.classList.remove("sel"));
  const el = ev.currentTarget; el.classList.add("sel");
  const m = document.createElement("div"); m.className = "menu";
  m.innerHTML = `<button data-a="edit">Modifier</button><button data-a="del">Supprimer</button><button data-a="cut">Supprimer à partir d'ici</button>`;
  document.body.appendChild(m);
  const r = el.getBoundingClientRect();
  m.style.left = Math.min(ev.clientX, innerWidth - 190) + "px";
  m.style.top = Math.min(Math.max(ev.clientY, r.top), innerHeight - 160) + "px";
  const close = () => { m.remove(); el.classList.remove("sel"); document.removeEventListener("pointerdown", outside, true); };
  const outside = e => { if(!m.contains(e.target)) close(); };
  setTimeout(() => document.addEventListener("pointerdown", outside, true), 0);
  m.onclick = e => {
    const act = e.target.dataset.a; if(!act) return; close();
    if(act === "edit") editAction(a);
    if(act === "del"){ adv.actions = adv.actions.filter(x => x.id !== a.id); redoStack = []; saveAdv(); renderStory(); }
    if(act === "cut"){ const i = adv.actions.findIndex(x => x.id === a.id); if(confirm("Supprimer ce passage et tout ce qui suit ?")){ adv.actions = adv.actions.slice(0, i); redoStack = []; saveAdv(); renderStory(); } }
  };
}
function editAction(a){
  let txt = a.text;
  openSheet("Modifier", null, (_, body) => {
    const t = field(body, a.type === "ai" ? "Texte de l'IA" : "Ton action", a.text, v => txt = v, { multiline: true, rows: 10 });
    btn(body, "Enregistrer", "", () => { a.text = txt; saveAdv(); closeSheet(); renderStory(); }).style.width = "100%";
    setTimeout(() => t.focus(), 50);
  });
}

/* ================= Context building ================= */
function formatPlayer(type, text){
  text = text.trim();
  if(type === "say") return `> « ${text.replace(/^["“«]\s*|\s*["”»]$/g, "")} »`;
  if(type === "do") return "> " + text;
  return text;
}
function triggeredCards(extraText){
  const recent = adv.actions.slice(-settings.cardScanDepth).map(a => a.text).join("\n") + "\n" + (extraText || "");
  const low = recent.toLowerCase();
  return adv.cards.filter(c => c.enabled !== false && (c.keys || "").split(",").map(k => k.trim().toLowerCase()).filter(Boolean).some(k => low.includes(k)));
}
function buildMessages(){
  const parts = [];
  if(adv.essentials.trim()) parts.push("[Plot essentials]\n" + adv.essentials.trim());
  if(adv.summary.trim()) parts.push("[Story summary so far]\n" + adv.summary.trim());
  const cards = triggeredCards("");
  if(cards.length) parts.push("[World info]\n" + cards.map(c => `- ${c.title ? c.title + ": " : ""}${c.entry.trim()}`).join("\n"));
  const system = (adv.instructions.trim() || DEFAULT_INSTRUCTIONS) + (parts.length ? "\n\n" + parts.join("\n\n") : "");

  const an = adv.authorsNote.trim() ? `[Author's note: ${adv.authorsNote.trim()}]` : "";
  let budget = settings.contextTokens - estTok(system) - estTok(an) - settings.max_tokens - 50;

  // walk history backwards until budget is spent
  const hist = [];
  for(let i = adv.actions.length - 1; i >= 0; i--){
    const a = adv.actions[i];
    const t = estTok(a.text);
    if(budget - t < 0 && hist.length) break;
    budget -= t; hist.unshift(a);
  }
  // map to chat roles, merging consecutive same-role turns
  const msgs = [];
  const push = (role, content) => {
    const last = msgs[msgs.length - 1];
    if(last && last.role === role) last.content += "\n\n" + content; else msgs.push({ role, content });
  };
  hist.forEach(a => {
    if(a.type === "ai") push("assistant", a.text);
    else push("user", a.text);
  });
  // the model must answer to a user turn
  if(!msgs.length || msgs[msgs.length - 1].role === "assistant") push("user", "(Continue the story.)");
  if(msgs[0].role === "assistant") msgs.unshift({ role: "user", content: "(Begin.)" });
  if(an){
    const last = msgs[msgs.length - 1];
    last.content = an + "\n\n" + last.content;
  }
  return [{ role: "system", content: system }, ...msgs];
}

/* ================= Generation ================= */
function stopGen(){ if(generating){ generating.abort(); generating = null; } }
async function generate(){
  if(!settings.apiKey){ toast("Ajoute ta clé OpenRouter dans les réglages"); openSettings(); return; }
  const messages = buildMessages();
  const out = { id: uid(), type: "ai", text: "" };
  adv.actions.push(out);
  renderStory(true);
  const el = $(`[data-id="${out.id}"]`); el.classList.add("caret");
  generating = new AbortController(); updateTools();
  const body = {
    model: settings.model.trim(), messages, stream: true,
    max_tokens: settings.max_tokens, temperature: settings.temperature, top_p: settings.top_p,
    usage: { include: true }
  };
  if(settings.top_k > 0) body.top_k = settings.top_k;
  if(settings.min_p > 0) body.min_p = settings.min_p;
  if(settings.repetition_penalty !== 1) body.repetition_penalty = settings.repetition_penalty;
  if(settings.presence_penalty) body.presence_penalty = settings.presence_penalty;
  if(settings.frequency_penalty) body.frequency_penalty = settings.frequency_penalty;
  if(settings.requireParams) body.provider = { require_parameters: true };
  if(settings.noReasoning) body.reasoning = { enabled: false, exclude: true };
  let errMsg = null;
  try{
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST", signal: generating.signal,
      headers: { "Authorization": "Bearer " + settings.apiKey.trim(), "Content-Type": "application/json", "X-Title": "Lanterne" },
      body: JSON.stringify(body)
    });
    if(!res.ok){
      let j = null; try{ j = await res.json(); }catch(e){}
      throw new Error((j && j.error && j.error.message) || ("HTTP " + res.status));
    }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    const view = $("#storyView");
    while(true){
      const { done, value } = await reader.read(); if(done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while((nl = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if(!line.startsWith("data:")) continue;
        const data = line.slice(5).trim(); if(data === "[DONE]") continue;
        let j; try{ j = JSON.parse(data); }catch(e){ continue; }
        if(j.error) throw new Error(j.error.message || "Erreur du fournisseur");
        const delta = j.choices?.[0]?.delta?.content;
        if(delta){
          const stick = view.scrollHeight - view.scrollTop - view.clientHeight < 80;
          out.text += delta; el.textContent = out.text.replace(/^\s+/, "");
          if(stick) view.scrollTop = view.scrollHeight;
        }
        if(j.usage){
          const u = j.usage;
          lastUsage = `${u.prompt_tokens ?? "?"} → ${u.completion_tokens ?? "?"} tokens` + (u.cost != null ? ` · $${Number(u.cost).toFixed(4)}` : "");
        }
      }
    }
  }catch(e){
    if(e.name !== "AbortError") errMsg = e.message;
  }
  generating = null;
  out.text = cleanOutput(out.text);
  if(!out.text) adv.actions = adv.actions.filter(a => a !== out);
  saveAdv(); renderStory(false);
  if(errMsg){
    const d = document.createElement("div"); d.className = "err"; d.textContent = "⚠ " + errMsg;
    $("#story").appendChild(d);
  }
  requestAnimationFrame(() => { const v = $("#storyView"); v.scrollTop = v.scrollHeight; });
}
function cleanOutput(t){
  t = t.replace(/<think>[\s\S]*?<\/think>/g, "").replace(/^\s+/, "").replace(/\s+$/, "");
  // drop a dangling half sentence if the model was cut off mid-way
  const m = t.match(/^[\s\S]*[.!?…"”»*)\]]/);
  if(m && m[0].length > t.length * 0.6) t = m[0];
  return t;
}
function submit(){
  if(generating){ stopGen(); return; }
  const inp = $("#inp"); const raw = inp.value;
  if(raw.trim()){
    adv.actions.push({ id: uid(), type: mode === "story" ? "story" : "player", text: formatPlayer(mode, raw) });
    inp.value = ""; autosize();
  }
  redoStack = [];
  saveAdv(); generate();
}
function autosize(){ const t = $("#inp"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, innerHeight * 0.3) + "px"; }

/* ================= Adventure sheet ================= */
function openAdventureSheet(start){
  const tabs = [["plot","Intrigue"],["cards","Story Cards"],["instr","Instructions"],["ctx","Contexte"],["misc","Aventure"]];
  openSheet(adv.title, tabs, (k, body) => {
    if(k === "plot"){
      field(body, "Plot Essentials", adv.essentials, v => { adv.essentials = v; saveAdv(); }, { multiline: true, rows: 7, hint: "Toujours envoyé à l'IA, en haut du contexte. Personnage, monde, objectifs." });
      field(body, "Author's Note", adv.authorsNote, v => { adv.authorsNote = v; saveAdv(); }, { multiline: true, rows: 3, hint: "Injecté juste avant ta dernière action : très influent. Ex. « Ton sombre, rythme lent, dialogues tendus. »" });
      field(body, "Résumé de l'histoire", adv.summary, v => { adv.summary = v; saveAdv(); }, { multiline: true, rows: 6, hint: "Mémoire longue : les événements importants qui sont sortis du contexte. (Résumé auto prévu pour la V2.)" });
    }
    if(k === "cards") renderCards(body);
    if(k === "instr"){
      field(body, "AI Instructions", adv.instructions, v => { adv.instructions = v; saveAdv(); }, { multiline: true, rows: 14, hint: "Le prompt système : comment l'IA doit raconter." });
      btn(body, "Remettre les instructions par défaut", "ghost", () => { adv.instructions = DEFAULT_INSTRUCTIONS; saveAdv(); openAdventureSheet("instr"); });
    }
    if(k === "ctx"){
      const msgs = buildMessages();
      const total = msgs.reduce((n, m) => n + estTok(m.content), 0);
      const cards = triggeredCards("");
      body.innerHTML = `<div class="hint">Ce qui sera envoyé au prochain tour · environ ${total} tokens sur ${settings.contextTokens}.</div>
        ${cards.length ? `<div class="chips">${cards.map(c => `<span class="chip">${esc(c.title || c.keys)}</span>`).join("")}</div>` : ""}`;
      const pre = document.createElement("pre"); pre.className = "ctx";
      pre.textContent = msgs.map(m => `── ${m.role.toUpperCase()} ──\n${m.content}`).join("\n\n");
      body.appendChild(pre);
    }
    if(k === "misc"){
      field(body, "Titre", adv.title, v => { adv.title = v; $("#title").textContent = v; saveAdv(); });
      const r = document.createElement("div"); r.className = "row"; r.style.flexWrap = "wrap"; body.appendChild(r);
      btn(r, "Dupliquer", "ghost", () => { const c = JSON.parse(JSON.stringify(adv)); c.id = uid(); c.title += " (copie)"; adv = c; saveAdv(); closeSheet(); openAdventure(c.id); toast("Copie créée"); });
      btn(r, "Exporter", "ghost", () => download(`${slug(adv.title)}.json`, { lanterne: 1, adventures: [adv] }));
      btn(r, "Supprimer", "danger", () => {
        if(!confirm("Supprimer définitivement cette aventure ?")) return;
        try{ localStorage.removeItem("lan.adv." + adv.id); }catch(e){}
        index = index.filter(x => x.id !== adv.id); LS.set("lan.index", index); closeSheet(); showLibrary();
      });
    }
  }, start);
}
function renderCards(body){
  body.innerHTML = `<div class="hint">Une carte est envoyée à l'IA quand l'un de ses mots-clés apparaît dans les ${settings.cardScanDepth} derniers passages.</div>`;
  btn(body, "+ Nouvelle carte", "", () => editCard(null)).style.cssText = "width:100%;margin-bottom:14px";
  const active = new Set(triggeredCards("").map(c => c.id));
  adv.cards.forEach(c => {
    const d = document.createElement("div"); d.className = "sc";
    d.innerHTML = `<div class="row"><div class="t" style="flex:1">${esc(c.title || "(sans titre)")}</div>${active.has(c.id) ? `<span class="chip" style="color:var(--acc2)">active</span>` : ""}${c.enabled === false ? `<span class="chip">off</span>` : ""}</div><div class="k">${esc(c.keys)}</div><div class="e">${esc(c.entry)}</div>`;
    d.onclick = () => editCard(c);
    body.appendChild(d);
  });
}
function editCard(c){
  const isNew = !c;
  const d = c ? Object.assign({}, c) : { id: uid(), title: "", type: "personnage", keys: "", entry: "", enabled: true };
  openSheet(isNew ? "Nouvelle carte" : "Modifier la carte", null, (_, body) => {
    field(body, "Nom", d.title, v => d.title = v, { placeholder: "Lyra" });
    const tl = document.createElement("label"); tl.className = "f"; tl.innerHTML = `<span>Type</span>`;
    const sel = document.createElement("select");
    ["personnage","lieu","objet","faction","concept","autre"].forEach(t => { const o = document.createElement("option"); o.value = o.textContent = t; if(t === d.type) o.selected = true; sel.appendChild(o); });
    sel.onchange = () => d.type = sel.value; tl.appendChild(sel); body.appendChild(tl);
    field(body, "Mots-clés", d.keys, v => d.keys = v, { placeholder: "Lyra, la prêtresse", hint: "Séparés par des virgules. Pas sensible à la casse." });
    field(body, "Contenu", d.entry, v => d.entry = v, { multiline: true, rows: 7, placeholder: "Lyra est une prêtresse de 30 ans, froide en apparence, qui cache..." });
    const sw = document.createElement("div"); sw.className = "sw";
    sw.innerHTML = `<div class="l"><b>Activée</b><small>Désactive sans supprimer.</small></div><button class="tg ${d.enabled !== false ? "on" : ""}"></button>`;
    sw.querySelector(".tg").onclick = e => { d.enabled = d.enabled === false; e.target.classList.toggle("on", d.enabled); };
    body.appendChild(sw);
    const r = document.createElement("div"); r.className = "row"; body.appendChild(r);
    btn(r, "Enregistrer", "", () => {
      if(isNew) adv.cards.push(d); else Object.assign(c, d);
      saveAdv(); openAdventureSheet("cards");
    }).style.flex = "1";
    if(!isNew) btn(r, "Supprimer", "danger", () => { adv.cards = adv.cards.filter(x => x.id !== d.id); saveAdv(); openAdventureSheet("cards"); });
  });
}

/* ================= Settings ================= */
const MODEL_SUGGESTIONS = ["deepseek/deepseek-v4-pro", "deepseek/deepseek-v4-flash", "z-ai/glm-5", "moonshotai/kimi-k2", "nousresearch/hermes-3-llama-3.1-405b", "anthropic/claude-sonnet-4.5"];
function openSettings(){
  openSheet("Réglages", [["model","Modèle"],["gen","Génération"],["ctx","Contexte"],["data","Données"]], (k, body) => {
    if(k === "model"){
      field(body, "Clé API OpenRouter", settings.apiKey, v => { settings.apiKey = v; saveSettings(); }, { type: "password", placeholder: "sk-or-v1-...", hint: "Stockée uniquement sur cet appareil. Envoyée seulement à openrouter.ai." });
      const m = field(body, "Modèle", settings.model, v => { settings.model = v; saveSettings(); }, { hint: "L'identifiant exact du modèle sur openrouter.ai/models." });
      const ch = document.createElement("div"); ch.className = "chips";
      MODEL_SUGGESTIONS.forEach(s => { const c = document.createElement("button"); c.className = "chip"; c.textContent = s; c.onclick = () => { m.value = s; settings.model = s; saveSettings(); }; ch.appendChild(c); });
      body.appendChild(ch);
      toggle(body, "Désactiver le raisonnement", "Plus rapide et moins cher pour la narration. Désactive si un modèle refuse.", "noReasoning");
      toggle(body, "Exiger le support des réglages", "Seuls les fournisseurs qui respectent top K, min P, etc. sont utilisés.", "requireParams");
      btn(body, "Tester la connexion", "ghost", testKey);
    }
    if(k === "gen"){
      slider(body, "Longueur de réponse", "max_tokens", 50, 1000, 10, "Nombre maximum de tokens par réponse.");
      slider(body, "Temperature", "temperature", 0, 2, 0.05, "Plus haut = plus imprévisible.");
      slider(body, "Top P", "top_p", 0, 1, 0.01, "Ne garde que les mots dont la probabilité cumulée atteint ce seuil.");
      slider(body, "Top K", "top_k", 0, 300, 1, "Limite aux K mots les plus probables. 0 = désactivé.");
      slider(body, "Min P", "min_p", 0, 0.5, 0.01, "Écarte les mots trop improbables par rapport au meilleur. 0 = désactivé.");
      slider(body, "Repetition penalty", "repetition_penalty", 1, 2, 0.01, "Réduit les répétitions. 1 = désactivé.");
      slider(body, "Presence penalty", "presence_penalty", -2, 2, 0.05, "Pénalise les mots déjà apparus, une seule fois.");
      slider(body, "Frequency penalty", "frequency_penalty", -2, 2, 0.05, "Pénalise selon le nombre d'apparitions.");
      btn(body, "Valeurs par défaut", "ghost", () => { ["max_tokens","temperature","top_p","top_k","min_p","repetition_penalty","presence_penalty","frequency_penalty"].forEach(k => settings[k] = DEFAULT_SETTINGS[k]); saveSettings(); openSettings(); });
    }
    if(k === "ctx"){
      slider(body, "Taille du contexte", "contextTokens", 2000, 128000, 1000, "Combien de tokens d'histoire envoyer. Plus = meilleure mémoire, mais chaque tour coûte plus.");
      slider(body, "Profondeur des Story Cards", "cardScanDepth", 1, 20, 1, "Nombre de passages récents scannés pour déclencher les cartes.");
      slider(body, "Taille du texte", "fontSize", 14, 24, 1);
    }
    if(k === "data"){
      body.innerHTML = `<div class="hint">Tout est enregistré dans ce navigateur. Exporte régulièrement une sauvegarde : si tu effaces les données du navigateur, tout part avec.</div>`;
      const r = document.createElement("div"); r.className = "row"; r.style.flexWrap = "wrap"; body.appendChild(r);
      btn(r, "Tout exporter", "ghost", () => {
        const all = index.map(x => LS.get("lan.adv." + x.id, null)).filter(Boolean);
        download(`lanterne-sauvegarde-${new Date().toISOString().slice(0,10)}.json`, { lanterne: 1, adventures: all });
      });
      btn(r, "Importer", "ghost", importFile);
    }
  });
}
async function testKey(){
  if(!settings.apiKey) return toast("Pas de clé");
  try{
    const r = await fetch("https://openrouter.ai/api/v1/key", { headers: { Authorization: "Bearer " + settings.apiKey.trim() } });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error?.message || r.status);
    const d = j.data || {};
    toast("Clé OK" + (d.usage != null ? ` · utilisé : $${Number(d.usage).toFixed(2)}` : "") + (d.limit_remaining != null ? ` · reste : $${Number(d.limit_remaining).toFixed(2)}` : ""));
  }catch(e){ toast("Échec : " + e.message); }
}
const slug = s => (s || "aventure").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "aventure";
function download(name, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importFile(){
  const i = document.createElement("input"); i.type = "file"; i.accept = "application/json,.json";
  i.onchange = async () => {
    try{
      const j = JSON.parse(await i.files[0].text());
      const list = j.adventures || (j.actions ? [j] : []);
      if(!list.length) throw new Error("aucune aventure trouvée");
      list.forEach(a => {
        if(index.some(x => x.id === a.id)) a.id = uid();
        a.cards ||= []; a.actions ||= []; a.instructions ??= DEFAULT_INSTRUCTIONS; a.essentials ??= ""; a.authorsNote ??= ""; a.summary ??= "";
        adv = a; saveAdv();
      });
      adv = null; toast(`${list.length} aventure(s) importée(s)`); closeSheet(); showLibrary();
    }catch(e){ toast("Import impossible : " + e.message); }
  };
  i.click();
}

/* ================= Wiring ================= */
$("#backBtn").onclick = showLibrary;
$("#setBtn").onclick = openSettings;
$("#advBtn").onclick = () => openAdventureSheet();
$("#sendBtn").onclick = submit;
$("#contBtn").onclick = () => { if(!generating){ redoStack = []; generate(); } };
$("#retryBtn").onclick = () => {
  if(generating) return;
  const i = adv.actions.map(a => a.type).lastIndexOf("ai"); if(i < 0) return;
  if(i === adv.actions.length - 1) adv.actions.pop();
  redoStack = []; saveAdv(); generate();
};
$("#undoBtn").onclick = () => { if(generating || !adv.actions.length) return; redoStack.push(adv.actions.pop()); saveAdv(); renderStory(true); };
$("#redoBtn").onclick = () => { if(generating || !redoStack.length) return; adv.actions.push(redoStack.pop()); saveAdv(); renderStory(true); };
$("#inp").addEventListener("input", autosize);
$("#inp").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches){ e.preventDefault(); submit(); } });
document.querySelectorAll(".mode").forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll(".mode").forEach(x => x.classList.toggle("on", x === b));
  $("#inp").placeholder = { do: "Que fais-tu ?", say: "Que dis-tu ?", story: "Écris la suite de l'histoire..." }[mode];
});
window.addEventListener("beforeunload", () => saveAdv());

applyFont();
showLibrary();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
