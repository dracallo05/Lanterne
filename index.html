<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1f1e1c">
<title>Lanterne</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#1f1e1c; --bg2:#262624; --bg3:#30302e; --line:#3d3c39;
  --tx:#e8e6dc; --tx2:#b5b3aa; --tx3:#85837b;
  --acc:#d97757; --acc2:#e8957a; --onacc:#1b1410; --err:#e07a6a;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --fs:17px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:6px;height:6px;background:transparent}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--tx3,#888) 35%,transparent);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--acc,#d97757) 60%,transparent)}
::-webkit-scrollbar-button{display:none;width:0;height:0}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--tx3,#888) 35%,transparent) transparent}}
#inp{scrollbar-width:none}#inp::-webkit-scrollbar{display:none}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:90px;line-height:1.45}
.hidden{display:none!important}
.app{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:6px;padding:10px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg)}
header h1{flex:1;font-size:16px;font-weight:600;margin:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
header h1 span{overflow:hidden;text-overflow:ellipsis}
.logo{width:30px;height:30px;border-radius:8px;flex:none}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--tx2);flex:none}
.ib:active{background:var(--bg3)}
.ib svg{width:22px;height:22px}
main{flex:1;overflow-y:auto;overscroll-behavior:contain}
.pad{padding:16px}
.btn{background:var(--acc);color:var(--onacc);font-weight:600;border-radius:12px;padding:12px 16px}
.btn:active{filter:brightness(.92)}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--bg3);color:var(--tx)}
.btn.danger{background:transparent;color:var(--err);border:1px solid color-mix(in srgb,var(--err) 40%,transparent)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.row{display:flex;gap:8px;align-items:center}
.empty{color:var(--tx3);text-align:center;padding:40px 10px;line-height:1.6}
.stat{display:flex;justify-content:space-between;align-items:center;color:var(--tx3);font-size:13px;margin:0 2px 14px}
.stat b{color:var(--tx2);font-weight:600;font-variant-numeric:tabular-nums}
/* Home */
.hero{padding:6px 2px 18px}
.hero .greet{font-family:var(--serif);font-size:28px;line-height:1.2}
.hero .sub{color:var(--tx3);margin-top:4px}
.stats{display:flex;gap:10px;margin:16px 0 4px}
.stats div{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats span{color:var(--tx3);font-size:12px}
.secT{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin:22px 2px 10px}
.cover{background-size:cover;background-position:center;position:relative;overflow:hidden}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);color:rgba(255,255,255,.35);font-size:44px}
.feat{border-radius:16px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);display:block;width:100%;text-align:left;padding:0}
.feat .cover{height:150px}
.feat .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}
.feat .in{padding:12px 14px 14px}
.feat .t{font-weight:600;font-size:17px}
.feat .s{color:var(--tx3);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--serif)}
.feat .go{color:var(--acc);font-weight:600;font-size:14px;margin-top:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;width:100%;text-align:left}
.item .cover{width:58px;height:58px;border-radius:10px;flex:none}
.item .cover .ph{font-size:24px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{color:var(--tx3);font-size:12px;margin-top:3px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.card .t{font-weight:600}
.card .s{color:var(--tx3);font-size:13px;margin-top:3px}
/* Story */
.banner{height:170px;margin-bottom:-40px}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,var(--bg))}
.story{padding:18px 18px 30px;font-family:var(--serif);font-size:var(--fs);line-height:1.62;position:relative}
.act{white-space:pre-wrap;word-wrap:break-word;padding:2px 0;border-radius:6px}
.act.player{color:var(--acc2);font-style:italic;margin:12px 0}
.act.sel{background:var(--bg3)}
.fi{animation:fi .6s ease-out both}
@keyframes fi{from{opacity:0;filter:blur(1.5px)}to{opacity:1;filter:none}}
.wait{display:inline-flex;gap:5px;padding:6px 0;vertical-align:middle}
.wait i{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:wt 1.4s ease-in-out infinite}
.wait i:nth-child(2){animation-delay:.2s}.wait i:nth-child(3){animation-delay:.4s}
@keyframes wt{0%,100%{opacity:.25}50%{opacity:.8}}
.wstat{font-family:var(--sans);font-size:13px;color:var(--tx3);margin-left:10px;vertical-align:middle}
.err{color:var(--err);font-family:var(--sans);font-size:14px;padding:8px 0}
.meta{color:var(--tx3);font-size:12px;font-family:var(--sans);text-align:center;padding:6px 0 0;font-variant-numeric:tabular-nums}
/* Input bar */
.bar{border-top:1px solid var(--line);background:var(--bg);padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.modes{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}
.mode{padding:6px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--tx2);font-size:13px;white-space:nowrap}
.mode.on{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{min-height:44px;max-height:30vh;resize:none;border-radius:22px;padding:11px 16px}
.send{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
.send.stop{background:var(--bg3);color:var(--tx)}
.tools{display:flex;justify-content:space-around;margin-top:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tx2);font-size:11px;padding:4px 8px;border-radius:8px}
.tool svg{width:20px;height:20px}
.tool:active{background:var(--bg3)}
.tool:disabled{opacity:.35}
/* Sheet — fixed height so tabs never move */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;height:90dvh;background:var(--bg);border-top-left-radius:20px;border-top-right-radius:20px;z-index:21;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:0}
.sheet .sh{display:flex;align-items:center;padding:10px 10px 0 16px;flex:none}
.sheet .sh h2{flex:1;font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);flex:none}
.tab{padding:8px 12px;border-radius:10px;color:var(--tx2);white-space:nowrap;font-size:14px}
.tab.on{background:var(--bg3);color:var(--tx)}
.sheet .body{flex:1;overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
label.f{display:block;margin:0 0 16px}
label.f > span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px;font-weight:600}
.hint{color:var(--tx3);font-size:13px;line-height:1.45;margin:-2px 0 8px}
.hint em{color:var(--tx2);font-style:italic}
.hint a{color:var(--acc2)}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sl{margin-bottom:18px}
.sl .top{display:flex;justify-content:space-between;align-items:baseline}
.sl .top b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.sl .top output{color:var(--tx);font-variant-numeric:tabular-nums}
input[type=range]{padding:0;border:0;background:transparent;height:30px;accent-color:var(--acc)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sw .l{flex:1}
.sw .l b{display:block;font-weight:500}
.sw .l small{color:var(--tx3);font-size:13px;line-height:1.4;display:block;margin-top:2px}
.tg{width:48px;height:28px;border-radius:999px;background:var(--bg3);position:relative;flex:none;border:1px solid var(--line)}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--tx3);transition:.15s}
.tg.on{background:var(--acc);border-color:var(--acc)}
.tg.on::after{left:23px;background:var(--onacc)}
.sc{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.sc .t{font-weight:600}
.sc .k{color:var(--acc2);font-size:12px;margin-top:2px}
.sc .e{color:var(--tx3);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
pre.ctx{white-space:pre-wrap;font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--tx2);overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--bg3);color:var(--tx2)}
.chip.acc{color:var(--acc2)}
details.fold{background:var(--bg2);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
details.fold summary{padding:12px 14px;cursor:pointer;color:var(--tx2);font-size:14px;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"▸ ";color:var(--tx3)}
details.fold[open] summary::before{content:"▾ "}
details.fold .in{padding:0 14px 4px}
.genbox{background:color-mix(in srgb,var(--acc) 7%,var(--bg2));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:14px;padding:14px;margin-bottom:16px}
.genbox .gt{font-weight:600;margin-bottom:4px}
.pickcover{height:120px;border-radius:14px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--tx3);margin-bottom:16px;width:100%;font-size:14px}
.pickcover.has{border:0}
.gauge{height:8px;border-radius:99px;background:var(--bg3);overflow:hidden;margin:8px 0 6px}
.gauge i{display:block;height:100%;background:var(--acc);border-radius:99px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;background:var(--bg2)}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.swatch{display:flex;gap:4px;margin-top:8px}
.swatch i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(128,128,128,.3)}
/* Models */
.mdl{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.mdl.on{border-color:var(--acc)}
.badge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;background:var(--bg3);overflow:hidden}
.badge img{width:26px;height:26px;border-radius:4px}
.mdl .grow{flex:1;min-width:0}
.mdl .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mdl .d{color:var(--tx3);font-size:13px;margin-top:2px;line-height:1.35}
.mdl .p{color:var(--tx2);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.mdl .tg2{color:var(--acc2);font-size:12px;margin-top:2px}
.mdl .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc2);margin-left:6px;vertical-align:1px}
.mdl .chk{color:var(--acc);font-size:18px;flex:none}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:90vw}
.menu{position:fixed;z-index:30;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:170px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.menu button{display:block;width:100%;text-align:left;padding:12px 16px}
.menu button:active{background:var(--bg3)}
.alts{display:flex;align-items:center;gap:4px;font-family:var(--sans);font-size:12px;color:var(--tx3);margin:2px 0 6px}
.alts button{width:30px;height:26px;border-radius:8px;color:var(--tx2);font-size:15px}
.alts button:active{background:var(--bg3)}
.alts button:disabled{opacity:.3}
.ideas{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.idea{text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;color:var(--tx)}
.idea:active{background:var(--bg3)}
.ideas .ih{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--tx3)}
.act.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{background:color-mix(in srgb,var(--acc) 25%,transparent)}100%{background:transparent}}
mark{background:color-mix(in srgb,var(--acc) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.res{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left;font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--tx2)}
.res .rk{font-family:var(--sans);font-size:11px;color:var(--tx3);margin-bottom:2px}
.ob{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.ob .box{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:760px;padding:22px 20px calc(18px + env(safe-area-inset-bottom))}
.ob .em{font-size:34px}
.ob h3{margin:8px 0 6px;font-size:20px;font-family:var(--serif);font-weight:500}
.ob p{color:var(--tx2);line-height:1.5;margin:0 0 16px;font-size:15px}
.ob .dots{display:flex;gap:6px}
.ob .dots i{width:7px;height:7px;border-radius:50%;background:var(--bg3)}
.ob .dots i.on{background:var(--acc)}
.bars{margin:6px 0 16px}
.bars .br{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--tx3);margin-bottom:6px}
.bars .bt{height:10px;background:var(--bg3);border-radius:99px;overflow:hidden}
.bars .bt i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bars .bv{color:var(--tx2);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.kpis div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpis b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kpis span{font-size:12px;color:var(--tx3)}
.tool{padding:4px 4px}
.syncline{display:block;margin-top:10px;font-size:12px;color:var(--tx3);padding:2px}
.syncline b{color:var(--tx2);font-weight:500}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="ib hidden" id="backBtn" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="title"></h1>
    <button class="ib hidden" id="searchBtn" aria-label="Rechercher"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="ib hidden" id="advBtn" aria-label="Aventure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 012-2h13v16H6a2 2 0 00-2 2.5zM4 19.5A2.5 2.5 0 016.5 22H19"/><path d="M9 7h6M9 11h6"/></svg></button>
    <button class="ib" id="setBtn" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </header>

  <main id="libView"><div class="pad" id="lib"></div></main>

  <main id="storyView" class="hidden"><div id="bannerHost"></div><div class="story" id="story"></div></main>
  <div class="bar hidden" id="bar">
    <div class="ideas hidden" id="ideas"></div>
    <div class="modes" id="modes">
      <button class="mode on" data-m="do">Faire</button>
      <button class="mode" data-m="say">Dire</button>
      <button class="mode" data-m="story">Histoire</button>
      <button class="mode" data-m="guide">Guide</button>
    </div>
    <div class="inrow">
      <textarea id="inp" rows="1" placeholder="Que fais-tu ?"></textarea>
      <button class="send" id="sendBtn" aria-label="Envoyer"></button>
    </div>
    <div class="tools">
      <button class="tool" id="contBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Continuer</button>
      <button class="tool" id="retryBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12a9 9 0 109-9 9.5 9.5 0 00-6.7 2.8L3 8"/><path d="M3 3v5h5"/></svg>Réessayer</button>
      <button class="tool" id="undoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>Annuler</button>
      <button class="tool" id="redoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg>Rétablir</button>
      <button class="tool" id="ideaBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>Idées</button>
      <button class="tool" id="ttsBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg><span>Écouter</span></button>
    </div>
  </div>
</div>

<div id="sheetHost"></div>

<script>
"use strict";

/* ================= Money ================= */
async function loadFx(){
  if(Date.now() - fx.t < 864e5) return;
  try{
    const r = await fetch("https://api.frankfurter.app/latest?from=USD&to=EUR");
    const j = await r.json();
    if(j.rates?.EUR){ fx = { rate: j.rates.EUR, t: Date.now() }; LS.set("lan.fx", fx); }
  }catch(e){}
}
const nf = (v, d) => v.toLocaleString("fr-FR", { minimumFractionDigits: 0, maximumFractionDigits: d });
function money(usd){
  const eur = settings.currency !== "USD";
  const v = (usd || 0) * (eur ? fx.rate : 1);
  const d = v === 0 ? 2 : v < 0.0001 ? 5 : v < 1 ? 4 : 2;
  const n = v.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
  return eur ? n + " €" : "$" + n.replace(",", ".");
}
const centimes = money;
function recordTurn(aiText, playerText){
  stats.turns++; stats.words += wordCount(aiText); stats.playerWords += wordCount(playerText || "");
  (stats.byModel[settings.model] ||= { turns: 0, usd: 0 }).turns++;
  stats.days[new Date().toISOString().slice(0, 10)] = 1;
  LS.set("lan.stats", stats);
  if(adv){ adv.turns = (adv.turns || 0) + 1; adv.words = (adv.words || 0) + wordCount(aiText) + wordCount(playerText || ""); }
}
function saveSettings(){ LS.set("lan.settings", settings); }
function addCost(c){
  if(!(c > 0)) return;
  stats.total += c;
  const mk = monthKey(); stats.byMonth[mk] = (stats.byMonth[mk] || 0) + c;
  const md = (stats.byModel[settings.model] ||= { turns: 0, usd: 0 }); md.usd += c;
  LS.set("lan.stats", stats);

}

function migrate(a){
  a.spent ||= 0; a.cards ||= []; a.actions ||= [];
  a.instructions ??= DEFAULT_INSTRUCTIONS; a.essentials ??= ""; a.authorsNote ??= ""; a.summary ??= "";
  a.style = Object.assign({}, DEFAULT_STYLE, a.style || {});
  a.scripts = Object.assign({ ac: false, is: false, names: "", player: "" }, a.scripts || {});

function normalizeCard(c){
  return Object.assign(c, {
    id: c.id || uid(), title: c.title ?? "", keys: c.keys ?? "", entry: c.entry ?? "",
    type: c.type || "autre", description: c.description ?? "", enabled: c.enabled !== false

/* ================= Style ================= */
const loadedFonts = new Set();
function loadFont(f){
  if(f.g && !loadedFonts.has(f.g)){
    loadedFonts.add(f.g);
    const l = document.createElement("link"); l.rel = "stylesheet";
    l.href = `https://fonts.googleapis.com/css2?family=${f.g}&display=swap`; document.head.appendChild(l);
  }
}
function applyStyle(style){
  const s = Object.assign({}, DEFAULT_STYLE, style || {});
  const t = THEMES[s.theme] || THEMES.braise;
  const root = document.documentElement.style;
  Object.entries(t.v).forEach(([k, v]) => root.setProperty("--" + k, v));
  const f = FONTS[s.font] || FONTS.classique;
  loadFont(f);
  root.setProperty("--serif", f.css);
  root.setProperty("--fs", (s.size || 17) + "px");
  document.querySelector('meta[name=theme-color]').content = t.v.bg;
}

/* ================= UI helpers ================= */
let toastT;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2800);
}
let syncPendingUI = false;
function closeSheet(){
  $("#sheetHost").innerHTML = "";

    syncPendingUI = false;
    if(!adv) showLibrary();
    else if(!generating){ const a = LS.get("lan.adv." + adv.id, null); if(a){ adv = migrate(a); applyStyle(adv.style); setHeaderTitle(adv.title, false); renderStory(false); } else showLibrary(); }
  }
}
function openSheet(title, tabs, renderTab, startTab){
  const host = $("#sheetHost");
  host.innerHTML = `<div class="scrim"></div><div class="sheet"><div class="sh"><h2>${esc(title)}</h2>
    <button class="ib" data-close aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    ${tabs ? `<div class="tabs">${tabs.map(t => `<button class="tab" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div>` : ""}
    <div class="body"></div></div>`;
  host.querySelector(".scrim").onclick = closeSheet;
  host.querySelector("[data-close]").onclick = closeSheet;
  const body = host.querySelector(".body");
  const show = k => {
    host.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === k));
    body.innerHTML = ""; body.scrollTop = 0; renderTab(k, body);
    host.querySelector(".tab.on")?.scrollIntoView({ inline: "nearest", block: "nearest" });
  };
  host.querySelectorAll(".tab").forEach(b => b.onclick = () => show(b.dataset.tab));
  show(startTab || (tabs ? tabs[0][0] : null));
  return body;
}
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
function field(body, label, value, onInput, opts = {}){
  const l = el("label", "f", `<span>${esc(label)}</span>${opts.hint ? `<div class="hint">${opts.hintHtml ? opts.hint : esc(opts.hint)}</div>` : ""}`);
  const e = document.createElement(opts.multiline ? "textarea" : "input");
  if(opts.type) e.type = opts.type;
  if(opts.rows) e.rows = opts.rows;
  if(opts.placeholder) e.placeholder = opts.placeholder;
  e.value = value ?? "";
  e.oninput = () => onInput(e.value);
  l.appendChild(e); body.appendChild(l);
  return e;
}
function slider(body, label, key, min, max, step, hint, obj = settings, save = saveSettings){
  const d = el("div", "sl", `<div class="top"><b>${esc(label)}</b><output>${obj[key]}</output></div>${hint ? `<div class="hint">${esc(hint)}</div>` : ""}<input type="range" min="${min}" max="${max}" step="${step}" value="${obj[key]}">`);
  const r = d.querySelector("input"), o = d.querySelector("output");
  r.oninput = () => { obj[key] = Number(r.value); o.textContent = r.value; save(); };
  body.appendChild(d);
}
function toggle(body, label, sub, get, set){
  const d = el("div", "sw", `<div class="l"><b>${esc(label)}</b><small>${sub}</small></div><button class="tg ${get() ? "on" : ""}"></button>`);
  const b = d.querySelector(".tg");
  b.onclick = () => { set(!get()); b.classList.toggle("on", get()); };
  body.appendChild(d);
  return d;
}
const settingToggle = (body, label, sub, key) => toggle(body, label, esc(sub), () => settings[key], v => { settings[key] = v; saveSettings(); });
function btn(body, text, cls, onClick){

  body.appendChild(b); return b;
}
function sec(body, text){ const d = el("div", "sec"); d.textContent = text; body.appendChild(d); }
function hint(body, html){ const d = el("div", "hint", html); body.appendChild(d); return d; }
function hueOf(s){ let h = 0; for(const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function coverEl(cls, id, title, pos){
  const d = el("div", "cover " + cls);
  const img = id ? getCover(id) : null;
  if(img){ d.style.backgroundImage = `url(${img})`; d.style.backgroundPosition = `center ${pos ?? 50}%`; }
  else {
    const h = hueOf(title || "?");
    d.style.background = `linear-gradient(135deg, hsl(${h} 32% 26%), hsl(${(h + 50) % 360} 30% 13%))`;
    d.appendChild(el("div", "ph", esc((visible(title) || "?").charAt(0).toUpperCase())));
  }
  return d;
}
function coverFramer(b, getImg, getPos, setPos){
  const img = getImg();
  const pc = el("button", "pickcover" + (img ? " has" : ""), img ? "" : "＋ Image de couverture");
  if(img){ pc.style.backgroundImage = `url(${img})`; pc.style.backgroundSize = "cover"; pc.style.backgroundPosition = `center ${getPos() ?? 50}%`; pc.style.height = "150px"; }
  b.appendChild(pc);
  if(img){
    const d = el("div", "sl", `<div class="top"><b>Cadrage</b><output>haut ↕ bas</output></div><div class="hint">Glisse pour choisir la partie de l'image qui reste visible.</div><input type="range" min="0" max="100" step="1" value="${getPos() ?? 50}">`);
    const r = d.querySelector("input");
    r.oninput = () => { setPos(Number(r.value)); pc.style.backgroundPosition = `center ${r.value}%`; };
    b.appendChild(d);
  }
  return pc;

function pickImage(){
  return new Promise((resolve) => {
    const i = document.createElement("input"); i.type = "file"; i.accept = "image/*";
    i.onchange = async () => {
      const f = i.files[0]; if(!f) return resolve(null);
      try{
        const bmp = await createImageBitmap(f);
        const w = Math.min(720, bmp.width), h = Math.round(bmp.height * w / bmp.width);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(bmp, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", 0.72));
      }catch(e){ toast("Image illisible"); resolve(null); }
    };
    i.click();
  });
}
const rtf = new Intl.RelativeTimeFormat("fr", { numeric: "auto" });
function ago(t){
  const s = (t - Date.now()) / 1000;
  const units = [["minute", 60, 60], ["hour", 3600, 24], ["day", 86400, 7], ["week", 604800, 4.35], ["month", 2629800, 12], ["year", 31557600, Infinity]];
  if(Math.abs(s) < 60) return "à l'instant";
  for(const [u, sec, max] of units){ const v = s / sec; if(Math.abs(v) < max) return rtf.format(Math.round(v), u); }
}

      it.appendChild(el("div", "grow", `<div class="t">${esc(x.title)}</div><div class="m">${ago(x.updated)}${x.spent ? " · " + money(x.spent) : ""}</div>`));

      lib.appendChild(it);
    });

/* ================= API ================= */
function apiConf(){
  return isOR() ? { url: "https://openrouter.ai/api/v1/chat/completions", or: true }
    : { url: (settings.baseUrl || "").trim().replace(/\/+$/, "").replace(/\/chat\/completions$/, "") + "/chat/completions", or: false };
}
async function callModel(messages, opts = {}){
  if(!settings.apiKey) throw new Error("Ajoute ta clé API dans les réglages");
  const { url, or } = apiConf();
  const body = { model: settings.model.trim(), messages, stream: !!opts.onDelta || opts.stream === true,
    max_tokens: opts.max_tokens ?? settings.max_tokens, temperature: opts.temperature ?? settings.temperature, top_p: opts.top_p ?? settings.top_p };
  if(!opts.plain){
    if(settings.presence_penalty) body.presence_penalty = settings.presence_penalty;
    if(settings.frequency_penalty) body.frequency_penalty = settings.frequency_penalty;
  }
  if(or){
    body.usage = { include: true };
    if(!opts.plain){
      if(settings.top_k > 0) body.top_k = settings.top_k;

  if(/^google\/gemini-3/.test(mid)){ delete body.temperature; delete body.top_p; delete body.top_k; delete body.min_p; delete body.presence_penalty; delete body.frequency_penalty; delete body.repetition_penalty; }

    body: JSON.stringify(body)

    let j = null; try{ j = await res.json(); }catch(e){}

function formatPlayer(type, text){
  text = text.trim();

function triggeredCards(){
  const recent = adv.actions.slice(-settings.cardScanDepth).map(a => a.text).join("\n").toLowerCase();
  return adv.cards.filter(c => c.enabled !== false && !isSystem(c) && !isBrain(c) && visible(c.entry) &&
    (c.keys || "").split(",").map(k => k.trim().toLowerCase()).filter(Boolean).some(k => recent.includes(k)));

function buildMessages(guide){
  const parts = [];
  if(adv.essentials.trim()) parts.push("[Plot essentials]\n" + adv.essentials.trim());
  if(adv.summary.trim()) parts.push("[Story summary so far]\n" + adv.summary.trim());
  const cards = triggeredCards();
  if(cards.length) parts.push("[World info]\n" + cards.map(c => `- ${cardName(c)}: ${c.entry.trim()}`).join("\n"));
  const system = (adv.instructions.trim() || DEFAULT_INSTRUCTIONS) + (parts.length ? "\n\n" + parts.join("\n\n") : "");
  const an = adv.authorsNote.trim() ? `[Author's note: ${adv.authorsNote.trim()}]` : "";
  let budget = settings.contextTokens - estTok(system) - estTok(an) - settings.max_tokens - 50;
  const hist = [];
  const acts = adv.actions.filter(a => !a.hidden);
  for(let i = acts.length - 1; i >= 0; i--){
    const a = acts[i]; const t = estTok(a.text);
    if(budget - t < 0 && hist.length) break;
    budget -= t; hist.unshift(a);
  }
  const msgs = [];
  const push = (role, content) => {
    const last = msgs[msgs.length - 1];
    if(last && last.role === role) last.content += "\n\n" + content; else msgs.push({ role, content });
  };
  hist.forEach(a => push(a.type === "ai" ? "assistant" : "user", visible(a.text)));
  if(!msgs.length || msgs[msgs.length - 1].role === "assistant") push("user", "(Continue the story.)");
  if(msgs[0].role === "assistant") msgs.unshift({ role: "user", content: "(Begin.)" });
  if(an){ const last = msgs[msgs.length - 1]; last.content = an + "\n\n" + last.content; }
  if(guide){ const last = msgs[msgs.length - 1]; last.content += "\n\n" + guideNote(guide); }
  return [{ role: "system", content: system }, ...msgs];
}
/* AI Dungeon–style single-text context, used when scripts are enabled */
const ctxCharLimit = () => Math.max(6000, Math.floor((settings.contextTokens - settings.max_tokens) * 3.5));

function buildAIDContext(){
  const limit = ctxCharLimit();
  const top = [];
  if(adv.essentials.trim()) top.push(adv.essentials.trim());
  const cards = triggeredCards();
  if(cards.length) top.push("World Lore:\n" + cards.map(c => c.entry.trim()).join("\n\n"));
  if(adv.summary.trim()) top.push("Story Summary:\n" + adv.summary.trim());
  const head = top.join("\n\n");
  const an = adv.authorsNote.trim() ? `[Author's note: ${adv.authorsNote.trim()}]` : "";
  let budget = limit - head.length - an.length - 40;
  const parts = [];
  for(let i = adv.actions.length - 1; i >= 0; i--){
    const t = adv.actions[i].text.replace(/^\s+|\s+$/g, "");
    if(!t) continue;
    if(budget - t.length < 0 && parts.length) break;
    budget -= t.length; parts.unshift(t);
  }
  if(an) parts.splice(Math.max(0, parts.length - 1), 0, an);
  return (head ? head + "\n\n" : "") + "Recent Story:\n" + parts.join("\n\n");
}

const wpend = new Map();

async function generate(input, opts = {}){

  const signal = generating.signal;
  let errMsg = null, final = null, finalAction = null;
  const guide = input?.kind === "guide" ? input.raw.trim() : (opts.guide || "");
  if(input?.kind === "guide") input = null;
  const playerText = input ? input.raw : "";
  try{
    if(!scriptsOn()){
      if(input) adv.actions.push({ id: uid(), type: input.kind === "story" ? "story" : "player", kind: input.kind, text: formatPlayer(input.kind, input.raw) });
      renderStory(true);
      const ph = placeholder();
      if(guide) ph.setStatus("🧭 guidé");
      let started = false, partial = "";
      const view = $("#storyView");
      let r;
      try{
        r = await callModel(buildMessages(guide), { signal, onDelta: delta => {
          partial += delta;
          if(!started){ delta = delta.replace(/^\s+/, ""); if(!delta) return; started = true; ph.el.innerHTML = ""; }

          if(stick) view.scrollTop = view.scrollHeight;
        } });
      }catch(e){ if(e.name === "AbortError") r = { text: partial, cost: 0 }; else throw e; }
      lastCost = r.cost || 0;
      final = cleanOutput(r.text);
      if(final){ finalAction = { id: uid(), type: "ai", text: final }; adv.actions.push(finalAction); }
    } else {
      if(input){
        const ri = await runHook("input", formatPlayer(input.kind, input.raw));
        adv.actions.push({ id: uid(), type: input.kind === "story" ? "story" : "player", kind: input.kind, text: ri.text });
      }
      renderStory(true);
      const ph = placeholder();
      lastCost = 0;
      for(let loop = 0; loop < 10; loop++){
        if(signal.aborted) break;
        const logStart = scriptLogs.length;
        const c = await runHook("context", buildAIDContext(), { maxChars: ctxCharLimit() });
        const agent = (adv.scriptState?.InnerSelf?.agent || "").trim();
        const gen = scriptLogs.slice(logStart).map(l => l.match(/Generating card for '([^']+)'/)).find(Boolean);
        ph.setStatus(gen ? `✨ Création de la carte « ${gen[1]} »…` : agent ? `🎭 ${agent} réfléchit…` : loop ? "✨ Auto-Cards travaille…" : guide ? "🧭 guidé" : "");
        if(c.stop) break;
        const ctxText = guide && !gen ? c.text + "\n\n" + guideNote(guide) : c.text;
        const r = await callModel(scriptMessages(ctxText), { signal, stream: true });
        lastCost += r.cost || 0;
        const o = await runHook("output", cleanOutput(r.text));
        const out = { id: uid(), type: "ai", text: o.text || "" };
        if(/>>>[\s\S]*please select[\s\S]*<<</i.test(out.text)){
          out.hidden = true; adv.actions.push(out); saveAdv();
          ph.setStatus("✨ Auto-Cards crée une carte…");
          continue;
        }
        if(visible(out.text)){ adv.actions.push(out); final = out.text; finalAction = out; }
        break;
      }
    }
  }catch(e){
    if(e.name !== "AbortError") errMsg = e.message;
  }
  if(finalAction){
    if(guide) finalAction.guide = guide;
    if(opts.alts?.length){ finalAction.alts = [...opts.alts, final]; finalAction.altIdx = finalAction.alts.length - 1; }
    recordTurn(final, playerText);
  } else if(opts.alts?.length && opts.restore){ adv.actions.push(opts.restore); }

  saveAdv();
  renderStory(false);
  if(final && scriptsOn()){
    const last = [...$("#story").querySelectorAll(".act.ai")].pop();
    if(last) last.classList.add("fi");
  }
  if(errMsg){ const d = el("div", "err"); d.textContent = "⚠ " + errMsg; $("#story").insertBefore(d, $("#story .meta")); }
  const v = $("#storyView"); if(v.scrollHeight - v.scrollTop - v.clientHeight < 300) v.scrollTop = v.scrollHeight;

  if(!errMsg) maybeSummarize();
}

      }
      if(!n) hint(res, "Aucun résultat.");
      else if(n >= 50) hint(res, "50 premiers résultats affichés, du plus récent au plus ancien.");
    };
    q.oninput = draw; draw(); setTimeout(() => q.focus(), 60);
  });
}

    ["🏮", "Bienvenue dans Lanterne", "Des aventures et du jeu de rôle avec l'IA. Tu joues, elle raconte, et tout reste sur ton téléphone."],

/* ================= Scenario sharing ================= */
function scenarioOf(a){
  const opening = a.actions.find(x => x.type === "ai" && !x.hidden);
  return { lanterne_scenario: 1, title: a.title, opening: opening ? visible(opening.text) : "", essentials: a.essentials, authorsNote: a.authorsNote,
    instructions: a.instructions, cards: a.cards.filter(c => !isBrain(c) && !isSystem(c)).map(c => ({ title: cardName(c), type: c.type, keys: c.keys, entry: c.entry })),
    scripts: { ac: !!a.scripts.ac, is: !!a.scripts.is, names: a.scripts.names || "", player: "" }, style: a.style,
    cover: a.hasCover ? getCover(a.id) : undefined, coverPos: a.coverPos };
}
async function shareScenario(){
  const sc = scenarioOf(adv);
  const name = `scenario-${slug(adv.title)}.json`;
  const blob = new Blob([JSON.stringify(sc, null, 2)], { type: "application/json" });
  try{
    const file = new File([blob], name, { type: "application/json" });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: adv.title, text: `Scénario Lanterne : ${adv.title}` });
      return;
    }
  }catch(e){ if(e.name === "AbortError") return; }
  download(name, sc);
  toast("Fichier téléchargé : envoie-le à tes potes");
}
function startFromScenario(sc){
  adventureWizard({
    title: sc.title || "", opening: sc.opening || "", essentials: sc.essentials || "", authorsNote: sc.authorsNote || "",
    instructions: sc.instructions || DEFAULT_INSTRUCTIONS,
    cards: (sc.cards || []).map(c => normalizeCard({ title: c.title, type: c.type, keys: c.keys, entry: c.entry })),
    scripts: Object.assign({ ac: false, is: false, names: "", player: "" }, sc.scripts || {}),
    cover: sc.cover || null, coverPos: sc.coverPos ?? 50, style: sc.style
  });
}
function importScenarioFile(){
  const i = document.createElement("input"); i.type = "file"; i.accept = "application/json,.json";
  i.onchange = async () => {
    try{
      const j = JSON.parse(await i.files[0].text());
      if(j.lanterne_scenario) startFromScenario(j);
      else if(j.adventures?.length) startFromScenario(scenarioOf(migrate(j.adventures[0])));
      else throw new Error("ce n'est pas un scénario Lanterne");
    }catch(e){ toast("Import impossible : " + e.message); }
  };
  i.click();

}
function refreshSyncLine(){ const l = $("#syncLine"); if(l) l.innerHTML = syncLabel(); const t = $("#syncTabStatus"); if(t) t.innerHTML = syncLabel(); }
async function sbFetch(path, opts = {}, withAuth = true){
  const c = syncConf();
  if(!c.url || !c.key) throw new Error("serveur non configuré");
  const headers = Object.assign({ apikey: c.key, "Content-Type": "application/json" }, opts.headers || {});
  if(withAuth) headers.Authorization = "Bearer " + await accessToken();
  const r = await fetch(c.url + path, Object.assign({}, opts, { headers }));
  if(!r.ok){
    let j = null; try{ j = await r.json(); }catch(e){}
    const msg = j && (j.msg || j.message || j.error_description || j.error) || ("HTTP " + r.status);
    const err = new Error(String(msg)); err.status = r.status; throw err;
  }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
function setAuth(j){
  auth = { access_token: j.access_token, refresh_token: j.refresh_token,
    expires_at: j.expires_at || (Math.floor(Date.now() / 1000) + (j.expires_in || 3600)), user: { id: j.user.id, email: j.user.email } };
  localStorage.setItem("lan.auth", JSON.stringify(auth));
}
async function accessToken(){
  if(!auth) throw new Error("non connecté");
  if(Date.now() / 1000 > auth.expires_at - 60){
    try{ setAuth(await sbFetch("/auth/v1/token?grant_type=refresh_token", { method: "POST", body: JSON.stringify({ refresh_token: auth.refresh_token }) }, false)); }
    catch(e){ if(e.status === 400 || e.status === 401){ signOut(true); throw new Error("session expirée, reconnecte-toi"); } throw e; }
  }
  return auth.access_token;
}
const authMsg = m => /invalid login|invalid_grant|invalid credentials/i.test(m) ? "e-mail ou mot de passe incorrect"
  : /already registered|already exists/i.test(m) ? "un compte existe déjà avec cet e-mail : connecte-toi"
  : /password/i.test(m) && /6|short|least/i.test(m) ? "mot de passe trop court (6 caractères minimum)"
  : /not confirmed/i.test(m) ? "e-mail pas encore confirmé (regarde ta boîte mail)" : m;
async function signIn(email, password){
  try{ setAuth(await sbFetch("/auth/v1/token?grant_type=password", { method: "POST", body: JSON.stringify({ email, password }) }, false)); }
  catch(e){ throw new Error(authMsg(e.message)); }
  await firstSync();
}
async function signUp(email, password){
  let j;
  try{ j = await sbFetch("/auth/v1/signup", { method: "POST", body: JSON.stringify({ email, password }) }, false); }
  catch(e){ throw new Error(authMsg(e.message)); }
  if(!j || !j.access_token) throw new Error("compte créé : confirme ton e-mail (lien reçu par mail), puis connecte-toi");
  setAuth(j); await firstSync();
}
function signOut(silent){
  const a = auth; auth = null; localStorage.removeItem("lan.auth"); localStorage.removeItem("lan.sync.last");
  if(a && !silent) fetch(syncConf().url + "/auth/v1/logout", { method: "POST", headers: { apikey: syncConf().key, Authorization: "Bearer " + a.access_token } }).catch(() => {});
  refreshSyncLine();
}
async function firstSync(){
  // stamp existing local data so it can be merged with the account (newest wins)
  const m = LS.get("lan.mtime", {}), d = LS.get("lan.dirty", {});
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(!SYNC_RE.test(k)) continue;
    if(!m[k]){ const v = LS.get(k, null); m[k] = (v && v.updated) || 1; }
    d[k] = 1;
  }
  localStorage.setItem("lan.mtime", JSON.stringify(m)); localStorage.setItem("lan.dirty", JSON.stringify(d));
  localStorage.removeItem("lan.sync.last");
  await syncNow(true);
}
async function syncPush(){
  const dirty = LS.get("lan.dirty", {}), mt = LS.get("lan.mtime", {});
  const keys = Object.keys(dirty);
  if(!keys.length) return;
  const snap = {};
  const rows = keys.map(k => {
    snap[k] = mt[k] || Date.now();
    const raw = localStorage.getItem(k);
    let data = raw ? JSON.parse(raw) : null;
    if(k === "lan.settings" && data && !settings.syncApiKey){ data = Object.assign({}, data); delete data.apiKey; }
    return { user_id: auth.user.id, key: k.slice(4), data, mtime: snap[k], deleted: !raw };
  });
  for(let i = 0; i < rows.length; i += 15){
    await sbFetch("/rest/v1/lanterne_docs?on_conflict=user_id,key", { method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(rows.slice(i, i + 15)) });
  }
  const now = LS.get("lan.mtime", {}), d2 = LS.get("lan.dirty", {});
  keys.forEach(k => { if((now[k] || 0) === snap[k]) delete d2[k]; });
  localStorage.setItem("lan.dirty", JSON.stringify(d2));
}
async function syncPull(){
  let last = localStorage.getItem("lan.sync.last") || "1970-01-01T00:00:00Z";
  const changed = [];
  for(let page = 0; page < 20; page++){
    const rows = await sbFetch(`/rest/v1/lanterne_docs?select=key,data,mtime,deleted,updated_at&updated_at=gt.${encodeURIComponent(last)}&order=updated_at.asc&limit=200`);
    if(!rows || !rows.length) break;
    const mt = LS.get("lan.mtime", {}), dirty = LS.get("lan.dirty", {});
    rows.forEach(r => {
      last = r.updated_at;
      const k = "lan." + r.key;
      if(!SYNC_RE.test(k)) return;
      const localM = mt[k] || 0;
      if(Number(r.mtime) <= localM) return;
      if(r.deleted) localStorage.removeItem(k);
      else{
        let data = r.data;
        if(k === "lan.settings"){ const cur = LS.get(k, {}); if(!data.apiKey && cur.apiKey) data = Object.assign({}, data, { apiKey: cur.apiKey }); }
        localStorage.setItem(k, JSON.stringify(data));
      }
      mt[k] = Number(r.mtime); delete dirty[k]; changed.push(k);
    });
    localStorage.setItem("lan.mtime", JSON.stringify(mt)); localStorage.setItem("lan.dirty", JSON.stringify(dirty));
    localStorage.setItem("lan.sync.last", last);
    if(rows.length < 200) break;
  }
  if(changed.length) applyPulled(changed);
}
function applyPulled(keys){
  let advChanged = false;
  keys.forEach(k => {
    if(k === "lan.settings") settings = Object.assign({}, DEFAULT_SETTINGS, LS.get("lan.settings", {}));
    else if(k === "lan.stats") stats = Object.assign({ total: 0, since: Date.now(), turns: 0, words: 0, playerWords: 0, byMonth: {}, byModel: {}, days: {} }, LS.get("lan.stats", {}));
    else{
      const id = k.replace(/^lan\.(adv|cover)\./, "");
      const a = LS.get("lan.adv." + id, null);
      index = index.filter(x => x.id !== id);
      if(a) index.push(indexEntry(a));
      if(adv && adv.id === id) advChanged = true;
    }
  });
  index.sort((x, y) => y.updated - x.updated);
  localStorage.setItem("lan.index", JSON.stringify(index));
  const sheetOpen = !!$("#sheetHost").innerHTML;
  if(sheetOpen && (!adv || advChanged)){ syncPendingUI = true; return; }
  if(!adv){ if(!$(".ob")) showLibrary(); }
  else if(advChanged && !generating){
    const a = LS.get("lan.adv." + adv.id, null);
    if(a){ adv = migrate(a); applyStyle(adv.style); setHeaderTitle(adv.title, false); renderStory(false); }
    else showLibrary();
  }
}
async function syncNow(manual){
  if(!auth || !syncConf().url){ refreshSyncLine(); return; }
  if(syncState.busy){ if(manual) toast("Synchronisation déjà en cours"); return; }
  syncState.busy = true; refreshSyncLine();
  try{
    await syncPush(); await syncPull(); await syncPush();
    syncState.err = ""; syncState.last = Date.now(); LS.set("lan.sync.when", syncState.last);
    if(manual) toast("Synchronisé ✓");
  }catch(e){
    syncState.err = /fetch|network/i.test(e.message) ? "hors ligne" : e.message;
    if(manual) toast("Synchro impossible : " + syncState.err);
  }
  syncState.busy = false; refreshSyncLine();
}

let modelCache = null;
async function loadModels(){
  if(modelCache) return modelCache;
  const r = await fetch("https://openrouter.ai/api/v1/models");
  const j = await r.json();
  modelCache = (j.data || []).filter(m => !/:free$/.test(m.id) && (m.architecture?.output_modalities || ["text"]).includes("text"));
  return modelCache;

function pickModels(all){
  const out = [];
  PICKS.forEach(p => {
    const hits = all.filter(m => p.re.test(m.id)).sort((a, b) => (b.created || 0) - (a.created || 0));
    hits.slice(0, p.multi || 1).forEach((m, i) => { if(!out.some(o => o.m.id === m.id)) out.push({ m, d: i ? "Version précédente, un peu moins chère." : p.d, pop: p.pop, tier: p.tier, tags: p.tags }); });
  });
  return out;
}
function badge(id){
  const v = id.split("/")[0];
  const b = el("div", "badge");

  const dom = VENDOR_DOMAIN[v];
  if(!dom){ letter(); return b; }
  const img = new Image(); img.alt = ""; img.referrerPolicy = "no-referrer";
  img.onerror = letter;
  img.onload = () => { if(img.naturalWidth <= 16) letter(); };

  b.appendChild(img);

}
function turnCost(m){

}
function openSettings(start){
  openSheet("Réglages", [["model","Modèle"],["gen","Génération"],["ctx","Mémoire"],["voice","Voix"],["sync","Compte"],["stats","Stats"],["data","Données"]], (k, body) => {
    if(k === "sync") renderSyncTab(body);
    if(k === "voice") renderVoiceTab(body);
    if(k === "stats") renderStatsTab(body);
    if(k === "model"){
      const tl = el("label", "f", `<span>Fournisseur</span>`);
      const sel = document.createElement("select");
      [["openrouter", "OpenRouter (recommandé)"], ["custom", "Autre API compatible OpenAI"]].forEach(([v, t]) => { const o = document.createElement("option"); o.value = v; o.textContent = t; if(settings.provider === v) o.selected = true; sel.appendChild(o); });
      sel.onchange = () => { settings.provider = sel.value; saveSettings(); openSettings("model"); };
      tl.appendChild(sel); body.appendChild(tl);
      if(!isOR()) field(body, "Adresse de l'API", settings.baseUrl, v => { settings.baseUrl = v; saveSettings(); }, { placeholder: "https://api.exemple.com/v1", hint: "L'adresse de base d'une API compatible OpenAI (DeepSeek, OpenAI, un serveur local…). Le suivi des dépenses ne marche qu'avec OpenRouter." });
      field(body, "Clé API", settings.apiKey, v => { settings.apiKey = v; saveSettings(); }, { type: "password", placeholder: isOR() ? "sk-or-v1-..." : "sk-...", hint: "Stockée uniquement sur cet appareil, envoyée seulement au fournisseur choisi." });
      if(isOR()){
        sec(body, "Modèle actuel");
        const holder = el("div"); body.appendChild(holder);
        const draw = () => {
          const cur = (modelCache || []).find(m => m.id === settings.model) || { id: settings.model, name: settings.model };
          holder.innerHTML = ""; holder.appendChild(modelRow(cur, cur.pricing ? null : "Touche pour voir les prix et changer", () => openModelPicker(() => openSettings("model"))));
        };
        draw();
        if(!modelCache) loadModels().then(() => holder.isConnected && draw()).catch(() => {});
        btn(body, "Changer de modèle", "ghost wide", () => openModelPicker(() => openSettings("model"))).style.marginBottom = "22px";
      } else {
        field(body, "Modèle", settings.model, v => { settings.model = v; saveSettings(); }, { placeholder: "deepseek-chat", hint: "L'identifiant du modèle chez ce fournisseur." });
      }
      settingToggle(body, "Désactiver le raisonnement", "Plus rapide et moins cher pour la narration. Désactive si un modèle refuse.", "noReasoning");
      if(isOR()){
        settingToggle(body, "Exiger le support des réglages", "Seuls les fournisseurs qui respectent top K, min P, etc. sont utilisés.", "requireParams");
        btn(body, "Tester la connexion", "ghost", testKey);
      }
    }
    if(k === "gen"){
      slider(body, "Longueur de réponse", "max_tokens", 50, 1000, 10, "Nombre maximum de tokens par réponse.");
      slider(body, "Temperature", "temperature", 0, 2, 0.05, "Plus haut = plus imprévisible.");
      slider(body, "Top P", "top_p", 0, 1, 0.01, "Ne garde que les mots dont la probabilité cumulée atteint ce seuil.");
      slider(body, "Top K", "top_k", 0, 300, 1, "Limite aux K mots les plus probables. 0 = désactivé.");
      slider(body, "Min P", "min_p", 0, 0.5, 0.01, "Écarte les mots trop improbables par rapport au meilleur. 0 = désactivé.");
      slider(body, "Repetition penalty", "repetition_penalty", 1, 2, 0.01, "Réduit les répétitions. 1 = désactivé.");
      slider(body, "Presence penalty", "presence_penalty", -2, 2, 0.05, "Pénalise les mots déjà apparus, une seule fois.");
      slider(body, "Frequency penalty", "frequency_penalty", -2, 2, 0.05, "Pénalise selon le nombre d'apparitions.");
      btn(body, "Valeurs par défaut", "ghost", () => { ["max_tokens","temperature","top_p","top_k","min_p","repetition_penalty","presence_penalty","frequency_penalty"].forEach(x => settings[x] = DEFAULT_SETTINGS[x]); saveSettings(); openSettings("gen"); });
    }
    if(k === "ctx"){
      slider(body, "Taille de la mémoire", "contextTokens", 2000, 128000, 1000, "Combien de tokens d'histoire l'IA voit à chaque tour. Plus = meilleure mémoire, mais chaque tour coûte plus.");
      slider(body, "Profondeur des Story Cards", "cardScanDepth", 1, 20, 1, "Combien de passages récents l'app relit pour chercher les mots-clés des cartes. À 4, une carte reste active tant que son mot-clé est apparu dans les 4 derniers passages.");
      slider(body, "Taille max d'une Story Card", "cardLimit", 300, 2000, 100, "En caractères. 1000 comme AI Dungeon : au-delà, l'IA retient moins bien les détails.");
      settingToggle(body, "Résumé automatique", "Quand des passages sortent de la mémoire de l'IA, ils sont résumés tout seuls dans le résumé de l'histoire.", "autoSummary");
    }
    if(k === "data"){
      const tl = el("label", "f", `<span>Devise</span>`);
      const sel = document.createElement("select");
      [["EUR", "Euro (€)"], ["USD", "Dollar ($)"]].forEach(([v, t]) => { const o = document.createElement("option"); o.value = v; o.textContent = t; if(settings.currency === v) o.selected = true; sel.appendChild(o); });
      sel.onchange = () => { settings.currency = sel.value; saveSettings(); openSettings("data"); };
      tl.appendChild(sel); body.appendChild(tl);
      if(settings.currency !== "USD") hint(body, `Conversion au taux du jour (1 $ ≈ ${nf(fx.rate, 3)} €). OpenRouter facture en dollars.`);
      body.appendChild(el("div", "stat", `<span>Total dépensé depuis le ${new Date(stats.since).toLocaleDateString("fr-FR")}</span><b>${money(stats.total)}</b>`));
      btn(body, "Remettre le compteur à zéro", "ghost small", () => { if(confirm("Remettre le total dépensé à zéro ?")){ stats = { total: 0, since: Date.now(), turns: 0, words: 0, playerWords: 0, byMonth: {}, byModel: {}, days: {} }; LS.set("lan.stats", stats); openSettings("data"); } }).style.marginBottom = "22px";
      sec(body, "Sauvegarde");
      hint(body, "Tout est enregistré sur ce téléphone. Exporte régulièrement une sauvegarde : si tu effaces les données de l'app, tout part avec.");
      const r = el("div", "row"); r.style.flexWrap = "wrap"; body.appendChild(r);
      btn(r, "Tout exporter", "ghost", () => {
        const all = index.map(x => { const a = LS.get("lan.adv." + x.id, null); if(a && a.hasCover) a.cover = getCover(a.id); return a; }).filter(Boolean);
        download(`lanterne-sauvegarde-${new Date().toISOString().slice(0,10)}.json`, { lanterne: 1, adventures: all });
      });
      btn(r, "Importer", "ghost", importFile);
      btn(body, "Revoir le tutoriel", "ghost small", () => { closeSheet(); onboarding(true); }).style.marginTop = "12px";
      sec(body, "Crédits");
      hint(body, `Scripts Auto-Cards et Inner Self par <a href="https://github.com/LewdLeah/Inner-Self" target="_blank" rel="noopener">LewdLeah</a>, sous licence MIT.`);
    }
  }, start);
}
async function testKey(){
  if(!settings.apiKey) return toast("Pas de clé");
  try{
    const r = await fetch("https://openrouter.ai/api/v1/key", { headers: { Authorization: "Bearer " + settings.apiKey.trim() } });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error?.message || r.status);
    const d = j.data || {};
    toast("Clé OK" + (d.usage != null ? ` · utilisé : ${money(Number(d.usage))}` : "") + (d.limit_remaining != null ? ` · reste : ${money(Number(d.limit_remaining))}` : ""));
  }catch(e){ toast("Échec : " + e.message); }
}
const slug = s => (s || "aventure").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "aventure";
function download(name, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importFile(){
  const i = document.createElement("input"); i.type = "file"; i.accept = "application/json,.json";
  i.onchange = async () => {
    try{
      const j = JSON.parse(await i.files[0].text());
      if(j.lanterne_scenario){ closeSheet(); startFromScenario(j); return; }
      const list = j.adventures || (j.actions ? [j] : []);
      if(!list.length) throw new Error("aucune aventure trouvée");
      list.forEach(a => {
        if(index.some(x => x.id === a.id)) a.id = uid();
        const cover = a.cover; delete a.cover;
        migrate(a);
        a.hasCover = !!(cover && LS.set("lan.cover." + a.id, cover));
        adv = a; saveAdv();
      });
      adv = null; toast(`${list.length} aventure(s) importée(s)`); closeSheet(); showLibrary();
    }catch(e){ toast("Import impossible : " + e.message); }
  };
  i.click();
}

/* ================= Wiring ================= */
$("#backBtn").onclick = showLibrary;
$("#setBtn").onclick = () => openSettings();
$("#advBtn").onclick = () => openAdventureSheet();
$("#sendBtn").onclick = submit;
$("#contBtn").onclick = () => { if(!generating){ redoStack = []; generate(null); } };
$("#retryBtn").onclick = () => {
  if(generating) return;
  popTrailingHidden();
  const last = adv.actions[adv.actions.length - 1];
  let alts = null, restore = null, guide = "";
  if(last && last.type === "ai" && adv.actions.length > 1){
    restore = adv.actions.pop();
    alts = restore.alts?.length ? [...restore.alts] : [restore.text];
    guide = restore.guide || "";
  }
  else if(!last || last.type === "ai") return toast("Rien à réessayer");
  popTrailingHidden();
  redoStack = []; saveAdv(); generate(null, { alts, restore, guide });
};
$("#undoBtn").onclick = () => {
  if(generating) return;
  popTrailingHidden();
  if(!adv.actions.length) return;
  redoStack.push(adv.actions.pop()); popTrailingHidden(); saveAdv(); renderStory(true);
};
$("#redoBtn").onclick = () => { if(generating || !redoStack.length) return; adv.actions.push(redoStack.pop()); saveAdv(); renderStory(true); };
$("#inp").addEventListener("input", autosize);
$("#ideaBtn").onclick = fetchIdeas;
$("#ttsBtn").onclick = () => { if(speaking()) stopSpeaking(); else { const a = [...adv.actions].reverse().find(x => x.type === "ai" && !x.hidden); if(a) speak(a.text); else toast("Rien à lire"); } };
$("#searchBtn").onclick = openSearch;
$("#inp").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches){ e.preventDefault(); submit(); } });
document.querySelectorAll(".mode").forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll(".mode").forEach(x => x.classList.toggle("on", x === b));
  $("#inp").placeholder = { do: "Que fais-tu ?", say: "Que dis-tu ?", story: "Écris la suite de l'histoire...", guide: "Oriente la suite (invisible dans l'histoire)…" }[mode];
});
window.addEventListener("beforeunload", () => saveAdv());

updateTools();
showLibrary();
onboarding();
syncNow(false);
loadFx().then(() => { if(!adv && !$("#sheetHost").innerHTML) showLibrary(); });
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
